<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mục lục trò chơi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Saira+Condensed:wght@700;800&display=swap">
<style>
/* Layout: one column; games grouped by grade, each row = game link + optional teacher stats link */
:root{--bg:#eef0ed;--card:#fff;--ink:#111719;--muted:#5f6c70;--line:#d5dad8;--accent:#1d4f8f;--flag:#f2c200;
  --display:'Saira Condensed','Arial Narrow',sans-serif;--body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 48px;padding-inline:16px;display:grid;gap:22px}
h1{font:800 clamp(34px,6vw,52px)/1 var(--display);margin:0;text-transform:uppercase}
h1 span{background:var(--flag);padding:0 6px}
.lead{margin:6px 0 0;color:var(--muted)}
h2{font:800 22px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line)}
li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
li:first-child{border-top:0}
.g{flex:1 1 260px;min-width:0;display:grid;gap:2px}
.g a{font-weight:700;font-size:17px;color:var(--ink);text-decoration:none}
.g a:hover{color:var(--accent);text-decoration:underline}
.g small{color:var(--muted)}
.tag{font:700 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;border:1.5px solid var(--ink);padding:4px 7px}
.stat{font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;border:1.5px solid var(--accent);padding:6px 10px}
.stat:hover{background:var(--accent);color:#fff}
a:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Trò chơi <span>lớp học</span></h1><p class="lead">Bấm tên trò chơi để mở. Trang thống kê dành cho giáo viên, cần mã giáo viên.</p></header>
  <main id="list" style="display:grid;gap:22px"></main>
</div>
<script>
const GROUPS=[
 ['Hóa học 12',[
   ['POLYMER-F1.html','Polymer Grand Prix','Đại cương về polymer · đua mô tô 3D','Cá nhân','THONGKE-POLYMER.html'],
   ['HOA12-DUAXEF1-POLYMER.html','Đua xe F1 Polymer','Bài 12, 13 · 7 TN + 2 Đ/S + 2 TLN','Nhóm','THONGKE-DUAXEF1-POLYMER.html'],
   ['HOA12-DUAXEF1-POLYMER-CANHAN.html','Đua xe F1 Polymer','Bài 12, 13 · 7 TN + 2 Đ/S + 2 TLN','Cá nhân','THONGKE-DUAXEF1-POLYMER-CANHAN.html'],
   ['HOA12CHUONG123.html','Escape the Cartoon Forest','Chương 1, 2, 3','Cá nhân'],
   ['H12-CHUONG123-NHOM.html','Escape the Cartoon Forest','Chương 1, 2, 3 · thi đua nhóm','Nhóm'],
   ['index.html','Escape the Cartoon Forest','Bài 1: Ester','Cá nhân']]],
 ['Hóa học 10',[
   ['HOA10-CHIMDUATHU.html','Chim Đưa Thư','Vạn Lý Trường Thành','Cá nhân'],
   ['HOA10-CHIMDUATHU-NHOM.html','Chim Đưa Thư','Vạn Lý Trường Thành · theo nhóm','Nhóm','THONGKE-CHIMDUATHU.html'],
   ['HOA10-DUAXEF1-NHOM.html','Đua xe F1','Theo nhóm','Nhóm','THONGKE-DUAXEF1.html'],
   ['HOA10-DUAXEF1-CANHAN.html','Đua xe F1','Bài 1–4 · 7 TN + 2 Đ/S + 2 TLN','Cá nhân','THONGKE-DUAXEF1-CANHAN.html'],
   ['RUONGLUA-CHUKI-NHOM.html','Ruộng lúa Chu kì','Theo nhóm','Nhóm','THONGKE-RUONGLUA.html'],
   ['DAINOI-HOA10.html','Đại Nội Huế 3D','','Cá nhân'],
   ['LANGBIANG-HOA10.html','Langbiang 3D','','Cá nhân']]],
 ['KHTN 9',[['DAINOI-KHTN9.html','Đại Nội Huế','KHTN 9','Cá nhân']]],
 ['Toán',[
   ['TOANLOP6.html','Escape the Cartoon Forest','Toán lớp 6 (có nhạc)','Cá nhân'],
   ['LOP3-CUUCHUONG.html','Escape the Cartoon Forest','Toán lớp 3 · cửu chương','Cá nhân']]],
 ['Khác',[['cave-explore.html','Khám phá hang động','','Cá nhân']]]
];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('list').innerHTML=GROUPS.map(([g,items])=>`<section><h2>${esc(g)}</h2><ul>${items.map(([f,n,d,t,s])=>`<li><div class="g"><a href="${f}">${esc(n)}</a>${d?`<small>${esc(d)}</small>`:''}</div><span class="tag">${t}</span>${s?`<a class="stat" href="${s}">Thống kê</a>`:''}</li>`).join('')}</ul></section>`).join('');
</script>
</body>
</html>
