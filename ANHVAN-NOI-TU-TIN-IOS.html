<head>

<style>
/* Layout concept: one-column phone app, thumb-reach controls at the bottom,
   equalizer bars as the recurring motif (logo, listening state). Teal = speaking, red = recording. */
:root{
  --bg:#F0F5F4; --surface:#FFFFFF; --surface2:#E6EEEE; --ink:#15303A; --muted:#55707A; --line:#D3DFE1;
  --accent:#0B7566; --accent-ink:#FFFFFF; --accent-soft:#D7EFE9; --on-soft:#07524A;
  --rec:#C93A27; --rec-soft:#FBE3DE;
  --good:#17753F; --good-soft:#DCF1E4; --warn:#7A4E00; --warn-soft:#FAEBC8; --bad:#B02E1D; --bad-soft:#FBE3DE;
  --shadow:0 1px 2px rgba(16,40,50,.06),0 6px 18px rgba(16,40,50,.06);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-ipa:"Noto Sans","Segoe UI","Arial Unicode MS","Charis SIL",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A1F; --surface:#15272E; --surface2:#1D343C; --ink:#E5EEF0; --muted:#9DB3BA; --line:#2A434C;
    --accent:#38BBA6; --accent-ink:#06211D; --accent-soft:#16403F; --on-soft:#8EE3D3;
    --rec:#EF6A55; --rec-soft:#4A2620;
    --good:#58C885; --good-soft:#16372A; --warn:#E3B04B; --warn-soft:#3C3014; --bad:#F2806F; --bad-soft:#44221D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A1F; --surface:#15272E; --surface2:#1D343C; --ink:#E5EEF0; --muted:#9DB3BA; --line:#2A434C;
  --accent:#38BBA6; --accent-ink:#06211D; --accent-soft:#16403F; --on-soft:#8EE3D3;
  --rec:#EF6A55; --rec-soft:#4A2620;
  --good:#58C885; --good-soft:#16372A; --warn:#E3B04B; --warn-soft:#3C3014; --bad:#F2806F; --bad-soft:#44221D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;min-height:100dvh;padding-top:env(safe-area-inset-top,0px)}
main{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;outline:none}
h1,h2,h3,p{margin:0}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:19px;font-weight:700;line-height:1.35;text-wrap:balance}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:14px} .center{text-align:center}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.label{font-size:13px;font-weight:600;color:var(--muted)}
button{font-family:inherit}
.ico{width:22px;height:22px;flex:none}
.top{display:flex;align-items:center;gap:10px;min-height:48px}
.top h1{flex:1;min-width:0}
.top-r{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;flex:1;font-weight:800;font-size:21px;letter-spacing:-.02em;color:var(--accent)}
.brand .ico{width:28px;height:28px}
.icon-btn{appearance:none;border:0;background:var(--surface);color:var(--ink);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface2);color:var(--ink);font-size:14px;font-weight:600;border:1px solid transparent}
.chip .ico{width:16px;height:16px}
.chip.streak{background:var(--accent-soft);color:var(--on-soft)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px;text-decoration-thickness:1.2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn-chip{cursor:pointer;background:var(--surface);border-color:var(--line);min-height:40px}
.vs{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;min-height:46px;padding:0 16px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--rec);border-color:var(--rec);color:#fff}
.btn.small{min-height:38px;font-size:14px;padding:0 12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ctrl,.recrow{display:flex;flex-wrap:wrap;gap:10px}
.ctrl>.btn,.recrow>.btn{flex:1 1 140px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.row-btn{appearance:none;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;color:var(--ink);font-size:16px;cursor:pointer;min-height:60px}
.rb-main{flex:1;min-width:0;display:flex;flex-direction:column}
.rb-main b{font-weight:700}
.rb-side{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.row-btn .ico{color:var(--muted);width:18px;height:18px}
.list{display:flex;flex-direction:column;gap:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;background:none;border:0;color:var(--muted);font-size:11.5px;font-weight:600;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:56px}
.tab[aria-current="page"]{color:var(--accent)}
.target{font-size:30px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.sent{font-size:23px;font-weight:600;line-height:1.45}
.w{display:inline-block;margin-right:.3em}
.w.ok{color:var(--good)}
.w.miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:5px;text-decoration-thickness:1.5px;font-weight:700}
.blur{filter:blur(9px);user-select:none}
.ipa{font-family:var(--font-ipa);color:var(--muted);font-size:17px;font-weight:400}
.syl{font-size:26px;font-weight:600;letter-spacing:.02em}
.syl b{color:var(--accent);font-weight:800;text-transform:uppercase}
.pair{display:flex;flex-direction:column;gap:6px}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0}
.mic{width:88px;height:88px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;position:relative;box-shadow:0 8px 22px rgba(11,117,102,.35)}
.mic .ico{width:38px;height:38px}
.mic.on{background:var(--rec)}
.mic.on::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--rec);opacity:.5;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.92);opacity:.6}to{transform:scale(1.25);opacity:0}}
.mic-hint{font-size:14px;color:var(--muted);text-align:center}
.live{min-height:22px;font-size:17px;font-weight:600;text-align:center;color:var(--ink)}
.bars{display:flex;gap:4px;height:28px;align-items:center}
.bars i{width:5px;border-radius:3px;background:var(--rec);height:25%;animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.12s}.bars i:nth-child(3){animation-delay:.24s}.bars i:nth-child(4){animation-delay:.36s}.bars i:nth-child(5){animation-delay:.48s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
@media (prefers-reduced-motion:reduce){.mic.on::after,.bars i{animation:none}.bars i{height:70%}.bar>i{transition:none}}
.result{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface2)}
.result.good{background:var(--good-soft);color:var(--good)}
.result.warn{background:var(--warn-soft);color:var(--warn)}
.result.good .small,.result.warn .small{color:var(--ink)}
.result b{font-size:16px}
.stars{font-size:22px;letter-spacing:3px}
.stars .off{opacity:.25}
.score{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.note{border-radius:12px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.msg{border-radius:12px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.nav2{display:flex;gap:10px}
.nav2>.btn{flex:1}
.count{font-size:14px;color:var(--muted);font-weight:600}
details.tipbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
details.tipbox summary{cursor:pointer;font-weight:700;font-size:15px}
details.tipbox p{margin-top:8px;font-size:15px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;font-size:16px}
.bub.them{background:var(--surface2);border-bottom-left-radius:4px;align-self:flex-start;display:flex;gap:8px;align-items:flex-start}
.bub.me{background:var(--accent-soft);color:var(--on-soft);border-bottom-right-radius:4px;align-self:flex-end}
.bub.me.miss{background:var(--surface2);color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:8px}
.mini-play{appearance:none;border:0;background:var(--surface);color:var(--accent);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;cursor:pointer}
.mini-play .ico{width:16px;height:16px}
.sample{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.timeline{display:flex;flex-direction:column;gap:8px}
.tl{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.tl[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.tl .n{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.tl[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
.big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
.form-row{display:flex;flex-direction:column;gap:6px}
select,input[type=range]{width:100%;font:inherit}
select{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px}
.seg{display:flex;gap:8px}
.seg label{flex:1}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;text-align:center;padding:0 6px}
.seg input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--on-soft)}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;max-width:90vw;text-align:center}
.diag{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.diag b{text-align:right}
.yes{color:var(--good)} .no{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.row-wrap{display:flex;gap:8px;align-items:stretch}
.row-wrap .row-btn{flex:1;min-width:0}
.row-wrap .del{align-self:center;flex:none}
.tag{font-size:12px;font-weight:700;color:var(--on-soft);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.ipa-f{font-family:var(--font-ipa)}
pre{margin:8px 0;padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:12.5px;line-height:1.5;overflow-x:auto;white-space:pre}
</style>
</head>

<script>
/*PURE-START*/
const CONTR={"i'm":["i","am"],"im":["i","am"],"it's":["it","is"],"its":["it","is"],"that's":["that","is"],"thats":["that","is"],"what's":["what","is"],"whats":["what","is"],"here's":["here","is"],"heres":["here","is"],"there's":["there","is"],"theres":["there","is"],"where's":["where","is"],"wheres":["where","is"],"how's":["how","is"],"he's":["he","is"],"she's":["she","is"],"let's":["let","us"],"lets":["let","us"],"you're":["you","are"],"youre":["you","are"],"we're":["we","are"],"they're":["they","are"],"theyre":["they","are"],"don't":["do","not"],"dont":["do","not"],"doesn't":["does","not"],"doesnt":["does","not"],"didn't":["did","not"],"didnt":["did","not"],"isn't":["is","not"],"isnt":["is","not"],"aren't":["are","not"],"wasn't":["was","not"],"can't":["can","not"],"cant":["can","not"],"cannot":["can","not"],"won't":["will","not"],"couldn't":["could","not"],"wouldn't":["would","not"],"i'd":["i","would"],"i'll":["i","will"],"i've":["i","have"],"you'll":["you","will"],"we'll":["we","will"],"you've":["you","have"],"we've":["we","have"],"you'd":["you","would"]};
const SYN={ok:"okay"};
const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function numWords(n){
  if(n<20) return ONES[n];
  if(n<100){ const t=Math.floor(n/10), o=n%10; return o? TENS[t]+" "+ONES[o] : TENS[t]; }
  return String(n);
}
function canonWords(str){
  let s=String(str||"").toLowerCase().replace(/[’‘`]/g,"'");
  s=s.replace(/\$\s?(\d+)/g,"$1 dollars");
  s=s.replace(/[-–—]/g," ");
  s=s.replace(/[^a-z0-9' ]+/g," ");
  const out=[];
  s.split(/\s+/).filter(Boolean).forEach(tok=>{
    tok=tok.replace(/^'+|'+$/g,"");
    if(!tok) return;
    if(/^\d+$/.test(tok)){ numWords(parseInt(tok,10)).split(" ").forEach(w=>out.push(w)); return; }
    if(CONTR[tok]){ CONTR[tok].forEach(w=>out.push(w)); return; }
    if(tok.endsWith("'s")) tok=tok.slice(0,-2);
    tok=tok.replace(/'/g,"");
    if(SYN[tok]) tok=SYN[tok];
    if(tok) out.push(tok);
  });
  return out;
}
function align(expTokens,heardStr){
  const E=[]; expTokens.forEach((t,ti)=>{ canonWords(t).forEach(w=>E.push({w,ti})); });
  const H=canonWords(heardStr);
  const n=E.length, m=H.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--){
    dp[i][j]= E[i].w===H[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  }
  const hit=new Array(n).fill(false);
  let i=0,j=0;
  while(i<n&&j<m){
    if(E[i].w===H[j]){ hit[i]=true; i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++;
  }
  const tokOk=expTokens.map(()=>true);
  E.forEach((e,k)=>{ if(!hit[k]) tokOk[e.ti]=false; });
  const matched=hit.filter(Boolean).length;
  return {tokOk,score:n?Math.round(100*matched/n):0,matched,total:n};
}
function keysCheck(keys,heardStr){
  const hs=" "+canonWords(heardStr).join(" ")+" ";
  return keys.map(k=>{
    const alts=k.split("|");
    const hit=alts.some(a=>hs.indexOf(" "+canonWords(a).join(" ")+" ")>=0);
    return {key:k,hit:hit,label:alts.join(" / ")};
  });
}
function dayKey(d){
  const p=x=>String(x).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function parseKey(k){ const a=k.split("-").map(Number); return new Date(a[0],a[1]-1,a[2]); }
function daysBetween(a,b){
  const x=parseKey(a), y=parseKey(b);
  return Math.round((Date.UTC(y.getFullYear(),y.getMonth(),y.getDate())-Date.UTC(x.getFullYear(),x.getMonth(),x.getDate()))/864e5);
}
function streakOf(days,todayKey,goal){
  const d=parseKey(todayKey); let n=0;
  if((days[dayKey(d)]||0)>=goal) n++;
  d.setDate(d.getDate()-1);
  while((days[dayKey(d)]||0)>=goal){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function autoKeys(u){
  const SKIP=['please','thank','thanks','that','this','with','have','would','could','will','your','from','just','here','there'];
  const all=canonWords(u);
  const ws=all.filter((w,i)=>w.length>=4&&SKIP.indexOf(w)<0&&all.indexOf(w)===i);
  ws.sort((a,b)=>b.length-a.length);
  const pick=ws.slice(0,2);
  if(!pick.length&&all.length) pick.push(all.reduce((a,b)=>b.length>a.length?b:a));
  return pick;
}

const KEY='noi-tu-tin-v1';
function defStore(){return {start:dayKey(new Date()),days:{},best:{},weak:{},done:{},custom:{words:[],sents:[],roles:[]},settings:{rate:0.9,accent:'en-US',voice:'',theme:'auto',goal:8,tr:''}};}
function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){ const o=JSON.parse(r); const d=defStore();
      const st=Object.assign(d,o,{settings:Object.assign(d.settings,o.settings||{})});
      st.custom=Object.assign({words:[],sents:[],roles:[]},st.custom||{});
      return st; }
  }catch(e){}

}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const synth=window.speechSynthesis;
const canRecord=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
let voices=[];
function loadVoices(){ try{voices=synth?synth.getVoices():[];}catch(e){voices=[];} }
if(synth){ loadVoices(); try{synth.onvoiceschanged=loadVoices;}catch(e){} }
function enVoices(){ return voices.filter(v=>/^en/i.test((v.lang||'').replace('_','-'))); }
function pickVoice(){
  if(store.settings.voice){ const v=voices.find(x=>x.voiceURI===store.settings.voice); if(v) return v; }
  const acc=store.settings.accent.toLowerCase();
  const list=voices.filter(v=>(v.lang||'').replace('_','-').toLowerCase().startsWith(acc));
  return list.find(v=>/enhanced|premium|natural|google|samantha|daniel|karen|aaron/i.test(v.name))||list[0]||enVoices()[0]||null;
}
let aud=null, recog=null;
const rec={mr:null,stream:null,chunks:[],url:null,mime:''};
function speak(text,slow,onend){
  if(!synth){ toast('Trình duyệt này chưa có giọng đọc mẫu.'); if(onend) onend(); return; }
  try{ synth.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  const v=pickVoice();
  if(v){ u.voice=v; u.lang=v.lang; } else u.lang=store.settings.accent;
  u.rate=slow?0.6:Number(store.settings.rate)||0.9;
  u.onend=()=>{ if(onend) onend(); };
  u.onerror=()=>{ if(onend) onend(); };
  synth.speak(u);
}
function stopOutput(){
  try{ if(synth) synth.cancel(); }catch(e){}
  if(aud){ try{aud.pause();}catch(e){} aud=null; }
}
function stopAll(){
  stopOutput();
  if(recog){ try{recog.abort();}catch(e){} recog=null; }
  if(rec.mr&&rec.mr.state!=='inactive'){
    try{ rec.mr.onstop=null; rec.mr.stop(); if(rec.stream) rec.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  }
}
function playUrl(url,onend){
  stopOutput();
  aud=new Audio(url);
  aud.onended=()=>{ if(onend) onend(); };
  const pr=aud.play(); if(pr&&pr.catch) pr.catch(()=>toast('Không phát được bản ghi âm này.'));
}
function listen(o){
  if(!SR){ o.onError('unsupported'); return; }
  if(recog){ try{recog.abort();}catch(e){} }
  const r=new SR(); recog=r;
  r.lang=store.settings.accent; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
  let fin='', last='', err='', ended=false;
  r.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) fin+=t+' '; else interim+=t;
    }
    last=(fin+interim).trim();
    if(o.onInterim) o.onInterim(last);
  };
  r.onerror=e=>{ err=e.error||'error'; };
  r.onend=()=>{
    if(ended) return; ended=true;
    if(recog===r) recog=null;
    const text=(fin.trim()||last).trim();
    if(text) o.onResult(text); else o.onError(err||'no-speech');
  };
  try{ r.start(); }catch(e){ ended=true; recog=null; o.onError('start-failed'); }
}
function stopListen(){ if(recog){ try{recog.stop();}catch(e){} } }
async function recStart(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  let mime='';
  for(const m of ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg']){
    if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)){ mime=m; break; }
  }
  const mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
  rec.mr=mr; rec.stream=stream; rec.chunks=[]; rec.mime=mr.mimeType||mime;
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) rec.chunks.push(e.data); };
  mr.start();
}
function recStop(){
  return new Promise(res=>{
    const mr=rec.mr;
    if(!mr||mr.state==='inactive'){ res(null); return; }
    mr.onstop=()=>{
      if(rec.stream) rec.stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(rec.chunks,{type:rec.mime||'audio/webm'});
      if(rec.url) URL.revokeObjectURL(rec.url);
      rec.url=URL.createObjectURL(blob);
      res(rec.url);
    };
    mr.stop();
  });
}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=n=>'<svg class="ico" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
let toastTimer=null;
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.hidden=true;},2600);
}
function today(){ return dayKey(new Date()); }
function bump(){
  const t=today(); const before=store.days[t]||0;
  store.days[t]=before+1;
  if(before+1===store.settings.goal) toast('Bạn đã đạt mục tiêu hôm nay. Giỏi lắm!');
}
function weakWord(w,ok){
  w=w.toLowerCase(); const o=store.weak[w];
  if(ok){ if(o){ o.s=(o.s||0)+1; if(o.s>=3) delete store.weak[w]; } }
  else store.weak[w]={m:(o?o.m:0)+1,s:0};
}
function weakFromTokens(toks,tokOk){
  toks.forEach((t,i)=>{
    const w=t.toLowerCase().replace(/[^a-z']/g,'');
    if(w.length<3||STOP.has(w)) return;
    weakWord(w,tokOk[i]);
  });
}
function applyTheme(){
  const t=store.settings.theme, r=document.documentElement;
  if(t==='light'||t==='dark') r.setAttribute('data-theme',t); else r.removeAttribute('data-theme');
}
function findDrillItem(w){
  for(const g of drillGroups()){ const it=groupItems(g).find(x=>x.w===w); if(it) return it; }
  return null;
}
function weakList(){
  return Object.keys(store.weak).sort((a,b)=>store.weak[b].m-store.weak[a].m).map(w=>{
    const k=findDrillItem(w);
    return {w:w,ipa:k?k.ipa:'',vi:k?k.vi:'',c:k?k.c:null,cipa:k?k.cipa:'',st:k?k.st:'',miss:store.weak[w].m};
  });
}
function tokHtml(toks,ok){
  return toks.map((t,i)=>'<span class="w'+(ok?(ok[i]?' ok':' miss'):'')+'">'+esc(t)+'</span>').join('');
}
function stressHtml(st){
  return st.split('-').map(p=>p===p.toUpperCase()?'<b>'+p+'</b>':p).join('·');
}
function starsHtml(score){
  const n=score>=85?3:score>=65?2:score>0?1:0;
  return '<span class="stars" aria-label="'+n+' trên 3 sao">'+[1,2,3].map(i=>'<span class="'+(i<=n?'':'off')+'">★</span>').join('')+'</span>';
}
function errMsg(c){
  switch(c){
    case 'aborted': return '';
    case 'no-speech': return 'Mình chưa nghe thấy giọng bạn. Thử nói gần micro hơn một chút nhé.';
    case 'not-allowed': case 'service-not-allowed': return 'Chưa có quyền dùng micro. Hãy cho phép micro cho trang này trong cài đặt trình duyệt rồi thử lại.';
    case 'network': return 'Chấm giọng cần kết nối mạng. Kiểm tra mạng rồi thử lại.';
    case 'audio-capture': return 'Không tìm thấy micro trên thiết bị này.';
    case 'unsupported': return 'Trình duyệt này chưa hỗ trợ chấm giọng.';
    default: return 'Chưa nghe được. Bạn thử lại nhé.';
  }
}

let V={view:'home'};
let P=null;
function go(v){ stopAll(); P=null; pendingDel=null; if(!(v.view==='role'&&v.add)) D=null; V=v; show(); window.scrollTo(0,0); }
function goBack(){
  const v=V;
  if(v.add) return go({view:v.view});

  if(v.view==='sent'){ if(v.card) return go({view:'sent',t:v.t}); if(v.t) return go({view:'sent'}); }
  if(v.view==='role'&&v.sc) return go({view:'role'});

function newP(o){ return Object.assign({res:null,msg:'',mine:null,live:'',listening:false,recording:false,hide:false,self:false,tok:0},o); }
function openCard(kind,id,i){
  stopAll();
  if(kind==='drill'){ const g=drillGroups().find(x=>x.id===id); P=newP({kind:'drill',g:g,list:groupItems(g),i:i}); V={view:'drill',g:id,card:true}; }
  else if(kind==='sent'){ const t=sentTopics().find(x=>x.id===id); P=newP({kind:'sent',t:t,list:topicSents(t),i:i}); V={view:'sent',t:id,card:true}; }

function openRole(id,level){

  if(!P) return '';

}
function move(d){

/* ====================== XỬ LÝ KẾT QUẢ NÓI ====================== */
function handleSpoken(text){
  bump();
  if(P.kind==='drill'||P.kind==='weak'){
    const it=P.list[P.i];
    const H=canonWords(text);
    const tw=canonWords(it.w);
    const ok=tw.length>0&&tw.every(x=>H.indexOf(x)>=0);
    const asC=!ok&&it.c&&H.indexOf(canonWords(it.c)[0])>=0;
    P.res={ok:ok,asC:!!asC,heard:text};
    weakWord(it.w,ok);
    if(ok&&P.g) store.done['d:'+P.g.id+':'+it.w]=1;
  }else if(P.kind==='sent'){
    const it=P.list[P.i];
    const toks=it.en.split(/\s+/);
    const a=align(toks,text);
    P.res={heard:text,toks:toks,tokOk:a.tokOk,score:a.score};
    const bk=P.t.id+':'+it.key; store.best[bk]=Math.max(store.best[bk]||0,a.score);
    weakFromTokens(toks,a.tokOk);
  }else if(P.kind==='role'){
    const T=P.sc.turns[P.turn];
    if(P.level===1){
      const toks=T.u.split(/\s+/);
      const a=align(toks,text);
      P.res={type:'sent',heard:text,toks:toks,tokOk:a.tokOk,score:a.score,pass:a.score>=60};
      weakFromTokens(toks,a.tokOk);
    }else{
      const ks=keysCheck(T.k,text);
      const n=ks.filter(x=>x.hit).length;
      P.res={type:'keys',heard:text,ks:ks,pass:n>=Math.ceil(ks.length*0.5)};
    }
  }
  save(); show();
}
function startListen(){
  if(!P) return;
  if(P.listening){ stopListen(); return; }
  stopOutput();
  const tok=P.tok=Date.now()+Math.random();
  P.listening=true; P.live=''; P.res=null; P.msg=''; P.self=false;
  const mine=()=>P&&P.tok===tok;
  show();
  listen({
    onInterim:t=>{ if(mine()){ P.live=t; const el=$('#live'); if(el) el.textContent=t; } },
    onResult:t=>{ if(mine()){ P.listening=false; handleSpoken(t); } },
    onError:c=>{ if(mine()){ P.listening=false; P.msg=errMsg(c); show(); } }
  });
}
async function toggleRec(){
  if(!P) return;
  if(P.listening) stopListen();
  if(P.recording){
    const url=await recStop();
    P.recording=false; if(url) P.mine=url; show(); return;
  }
  stopOutput();
  try{ await recStart(); P.recording=true; show(); }
  catch(e){ P.msg='Chưa có quyền dùng micro để ghi âm. Hãy cho phép micro cho trang này rồi thử lại.'; show(); }
}

const TRANSLATE_URL='https://script.google.com/macros/s/AKfycbw_mQGIppx-rCBjRNmNkpQQONkG8V5C63X2ZBGZQduDARj4iK5G_vV_SB4bAXbLJxAR/exec';
function trUrl(){ return String(store.settings.tr||TRANSLATE_URL||'').trim(); }
const AS_CODE=[
  'function doGet(e) {',
  '  var q = String((e && e.parameter && e.parameter.q) || "").slice(0, 300);',
  '  var out = { ok: false };',
  '  if (q) {',
  '    try { out = { ok: true, en: LanguageApp.translate(q, "vi", "en") }; }',
  '    catch (err) { out = { ok: false, error: String(err) }; }',
  '  }',
  '  return ContentService.createTextOutput(JSON.stringify(out))',
  '    .setMimeType(ContentService.MimeType.JSON);',
  '}'
].join('\n');
let trBusy=false;
function tidyEn(s,mode){
  s=String(s||'').replace(/&#39;|&apos;/g,"'").replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
  if(mode==='word'){ s=s.replace(/[.!?,;:]+$/,'').trim(); if(s!=='I') s=s.toLowerCase(); }
  return s;
}
async function translateVi(text){
  const url=trUrl();
  if(!url) throw new Error('nourl');
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),15000);
  try{
    const r=await fetch(url+(url.indexOf('?')>=0?'&':'?')+'q='+encodeURIComponent(text),{signal:ctl.signal});
    if(!r.ok) throw new Error('http');
    const j=await r.json();
    if(!j||!j.ok||!j.en) throw new Error('bad');
    return String(j.en);
  } finally { clearTimeout(timer); }
}
function trErr(e){
  const m=e&&e.message;
  if(m==='nourl') return 'Chưa cài chức năng dịch. Vào Cài đặt, mục "Dịch tiếng Việt sang tiếng Anh", để cài một lần.';
  if(e&&e.name==='AbortError') return 'Dịch quá lâu nên đã dừng. Thử lại sau vài giây.';
  if(m==='http'||m==='bad'||(e&&e.name==='SyntaxError')) return 'Chưa dịch được. Kiểm tra lại địa chỉ Apps Script, và quyền truy cập phải là "Bất kỳ ai".';
  return 'Không kết nối được. Kiểm tra mạng rồi thử lại.';
}
async function doTranslate(kind,i,el){
  const map={word:['f-vi','f-w'],sent:['f-vi','f-en'],rp:['r-pv'+i,'r-p'+i],ru:['r-uv'+i,'r-u'+i]};
  const ids=map[kind]; if(!ids) return;
  const src=val(ids[0]).trim();
  if(!src) return formErr('Hãy gõ tiếng Việt trước, rồi bấm Dịch.');
  if(!trUrl()) return formErr(trErr(new Error('nourl')));
  if(trBusy) return;
  trBusy=true;
  const old=el?el.textContent:'';
  if(el){ el.disabled=true; el.textContent='Đang dịch…'; }
  const m0=$('#f-msg'); if(m0) m0.hidden=true;
  try{
    const en=tidyEn(await translateVi(src),kind==='word'?'word':'');
    const dst=$('#'+ids[1]);
    if(dst){ dst.value=en; toast('Đã dịch. Hãy kiểm tra và sửa nếu cần.'); }
  }catch(e){ if($('#f-msg')) formErr(trErr(e)); }
  finally{ trBusy=false; if(el){ el.disabled=false; el.textContent=old; } }
}
async function trTest(){
  const out=$('#tr-out'); if(!out) return;
  out.hidden=false;
  if(!trUrl()){ out.textContent='Hãy dán địa chỉ Apps Script vào ô phía trên trước.'; return; }
  out.textContent='Đang thử…';
  try{ const en=await translateVi('Xin chào, bạn khỏe không?'); out.textContent='Dịch được: “'+tidyEn(en)+'”'; }
  catch(e){ out.textContent=trErr(e); }
}
function trNote(){
  return trUrl()?'':'<div class="note">Chưa cài chức năng dịch. Bạn vẫn thêm được bằng cách gõ tiếng Anh trực tiếp.<br><button class="btn small" data-a="settings" style="margin-top:8px">Mở Cài đặt để cài một lần</button></div>';
}
/* ====================== THÊM TỪ, CÂU, TÌNH HUỐNG ====================== */
function val(id){ const e=$('#'+id); return e?e.value:''; }
function formErr(msg){ const m=$('#f-msg'); if(m){ m.textContent=msg; m.hidden=false; } }
function clearFields(ids){ ids.forEach(id=>{ const e=$('#'+id); if(e) e.value=''; }); const m=$('#f-msg'); if(m) m.hidden=true; }
function saveWord(){
  const g=val('f-g'), w=val('f-w').trim().replace(/\s+/g,' '), vi=val('f-vi').trim(), ipa=val('f-ipa').trim();
  const grp=drillGroups().find(x=>x.id===g)||MY_G;
  if(!w) return formErr('Hãy nhập từ tiếng Anh.');
  if(!/^[A-Za-z][A-Za-z' -]*$/.test(w)) return formErr('Chỉ dùng chữ cái tiếng Anh, dấu cách, dấu gạch ngang hoặc dấu nháy.');
  if(groupItems(grp).some(it=>it.w.toLowerCase()===w.toLowerCase())) return formErr('Từ này đã có trong nhóm.');
  store.custom.words.push({id:'w'+Date.now(),g:grp.id,w:w,vi:vi,ipa:ipa});
  save(); clearFields(['f-w','f-vi','f-ipa']);
  toast('Đã thêm “'+w+'”.');
  const f=$('#f-w'); if(f&&f.focus) f.focus();
}
function saveSent(){
  const t=val('f-t'), en=val('f-en').trim().replace(/\s+/g,' '), vi=val('f-vi').trim();
  const top=sentTopics().find(x=>x.id===t)||MY_T;
  if(!en) return formErr('Hãy nhập câu tiếng Anh.');
  if(!/[A-Za-z]/.test(en)) return formErr('Câu cần có chữ cái tiếng Anh.');
  if(en.length>140) return formErr('Câu hơi dài. Hãy chia thành các câu ngắn hơn, tối đa 140 ký tự.');
  if(topicSents(top).some(x=>x.en.toLowerCase()===en.toLowerCase())) return formErr('Câu này đã có trong chủ đề.');
  store.custom.sents.push({id:'s'+Date.now(),t:top.id,en:en,vi:vi});
  save(); clearFields(['f-en','f-vi']);
  toast('Đã thêm câu.');
  const f=$('#f-en'); if(f&&f.focus) f.focus();
}
function newDraft(){ return {t:'',intro:'',turns:[{p:'',u:'',uv:'',k:'',pv:''},{p:'',u:'',uv:'',k:'',pv:''}]}; }
function collectDraft(){
  if(!D) return;
  D.t=val('r-t'); D.intro=val('r-intro');
  D.turns=D.turns.map((_,i)=>({p:val('r-p'+i),u:val('r-u'+i),uv:val('r-uv'+i),k:val('r-k'+i),pv:val('r-pv'+i)}));
}
function saveRole(){
  collectDraft();
  const t=D.t.trim();
  if(!t) return formErr('Hãy đặt tên cho tình huống.');
  const turns=[];
  for(let i=0;i<D.turns.length;i++){
    const x=D.turns[i], p=x.p.trim().replace(/\s+/g,' '), u=x.u.trim().replace(/\s+/g,' '), uv=x.uv.trim();
    if(!p||!u) return formErr('Lượt '+(i+1)+': cần cả câu máy nói và câu bạn trả lời.');
    if(!/[A-Za-z]/.test(p)||!/[A-Za-z]/.test(u)) return formErr('Lượt '+(i+1)+': câu cần có chữ cái tiếng Anh.');
    if(p.length>140||u.length>140) return formErr('Lượt '+(i+1)+': câu quá dài, tối đa 140 ký tự.');
    let k=x.k.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
    if(!k.length) k=autoKeys(u);
    turns.push({p:p,u:u,uv:uv,k:k});
  }
  store.custom.roles.push({id:'u'+Date.now(),t:t,intro:D.intro.trim()||'Tình huống do bạn tạo.',turns:turns,custom:true});
  save(); toast('Đã lưu tình huống.'); D=null; go({view:'role'});
}
function viewDrillAdd(){
  const sel=V.g||'my';
  return head('Thêm từ',true)+
  '<section class="card">'+trNote()+
  '<div class="field"><label class="label" for="f-g">Thêm vào nhóm</label><select id="f-g">'+
    drillGroups().map(g=>'<option value="'+g.id+'"'+(g.id===sel?' selected':'')+'>'+esc(g.t)+'</option>').join('')+'</select></div>'+
  '<div class="field"><label class="label" for="f-vi">Gõ nghĩa tiếng Việt, rồi bấm Dịch</label><input id="f-vi" type="text" maxlength="60" autocomplete="off" placeholder="ví dụ: lịch trình"></div>'+
  '<button class="btn small" data-a="tr-word">Dịch sang tiếng Anh</button>'+
  '<div class="field"><label class="label" for="f-w">Từ hoặc cụm từ tiếng Anh (bạn có thể sửa)</label><input id="f-w" type="text" maxlength="40" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="ví dụ: schedule"></div>'+
  '<div class="field"><label class="label" for="f-ipa">Phiên âm IPA (không bắt buộc)</label><input id="f-ipa" type="text" maxlength="40" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="ví dụ: /ˈskedʒuːl/"></div>'+
  '<p id="f-msg" class="msg" role="alert" hidden></p><button class="btn primary" data-a="save-word">Lưu từ</button>'+
  '<p class="muted small">Sau khi lưu, ô nhập được xóa để bạn thêm từ tiếp theo. Bấm nút quay lại khi xong.</p></section>';
}
function viewSentAdd(){
  const sel=V.t||'my';
  return head('Thêm câu',true)+
  '<section class="card">'+trNote()+
  '<div class="field"><label class="label" for="f-t">Thêm vào chủ đề</label><select id="f-t">'+
    sentTopics().map(t=>'<option value="'+t.id+'"'+(t.id===sel?' selected':'')+'>'+esc(t.t)+'</option>').join('')+'</select></div>'+
  '<div class="field"><label class="label" for="f-vi">Gõ câu tiếng Việt, rồi bấm Dịch</label><textarea id="f-vi" maxlength="200" rows="2" autocomplete="off" placeholder="ví dụ: Bạn gợi ý giúp một nhà hàng ngon được không?"></textarea></div>'+
  '<button class="btn small" data-a="tr-sent">Dịch sang tiếng Anh</button>'+
  '<div class="field"><label class="label" for="f-en">Câu tiếng Anh (bạn có thể sửa)</label><textarea id="f-en" maxlength="140" rows="2" autocomplete="off" placeholder="ví dụ: Could you recommend a good restaurant?"></textarea></div>'+
  '<p id="f-msg" class="msg" role="alert" hidden></p><button class="btn primary" data-a="save-sent">Lưu câu</button>'+
  '<p class="muted small">Câu ngắn (tối đa 140 ký tự) sẽ dễ luyện và máy chấm chính xác hơn.</p></section>';
}
function viewRoleAdd(){
  if(!D) D=newDraft();
  const n=D.turns.length;
  return head('Tạo tình huống',true)+
  '<section class="card">'+trNote()+
  '<div class="field"><label class="label" for="r-t">Tên tình huống</label><input id="r-t" type="text" maxlength="40" autocomplete="off" value="'+esc(D.t)+'" placeholder="ví dụ: Gọi taxi"></div>'+
  '<div class="field"><label class="label" for="r-intro">Bối cảnh (không bắt buộc)</label><input id="r-intro" type="text" maxlength="100" autocomplete="off" value="'+esc(D.intro)+'" placeholder="ví dụ: Bạn đang đứng trước khách sạn và cần một chiếc taxi."></div>'+
  '<p class="muted small">Mỗi lượt gồm một câu máy nói rồi một câu bạn trả lời. Bạn gõ tiếng Việt và bấm Dịch, hoặc gõ thẳng tiếng Anh. Từ khóa để trống thì app tự chọn từ quan trọng trong câu trả lời. Dùng dấu | cho từ thay thế, ví dụ: taxi|cab.</p></section>'+
  D.turns.map((x,i)=>'<section class="card"><h3>Lượt '+(i+1)+'</h3>'+
    '<div class="field"><label class="label" for="r-pv'+i+'">Máy nói: gõ tiếng Việt (không bắt buộc)</label><input id="r-pv'+i+'" type="text" maxlength="200" autocomplete="off" value="'+esc(x.pv||'')+'"></div>'+
    '<button class="btn small" data-a="tr-rp" data-v="'+i+'">Dịch sang tiếng Anh</button>'+
    '<div class="field"><label class="label" for="r-p'+i+'">Máy nói (tiếng Anh)</label><input id="r-p'+i+'" type="text" maxlength="140" autocomplete="off" value="'+esc(x.p)+'"></div>'+
    '<div class="field"><label class="label" for="r-uv'+i+'">Bạn trả lời: gõ tiếng Việt</label><input id="r-uv'+i+'" type="text" maxlength="200" autocomplete="off" value="'+esc(x.uv)+'"></div>'+
    '<button class="btn small" data-a="tr-ru" data-v="'+i+'">Dịch sang tiếng Anh</button>'+
    '<div class="field"><label class="label" for="r-u'+i+'">Bạn trả lời (tiếng Anh)</label><input id="r-u'+i+'" type="text" maxlength="140" autocomplete="off" value="'+esc(x.u)+'"></div>'+
    '<div class="field"><label class="label" for="r-k'+i+'">Từ khóa để chấm (không bắt buộc)</label><input id="r-k'+i+'" type="text" maxlength="80" autocapitalize="none" autocomplete="off" value="'+esc(x.k)+'" placeholder="cách nhau bằng dấu phẩy, ví dụ: taxi, airport"></div></section>').join('')+
  '<p id="f-msg" class="msg" role="alert" hidden></p>'+
  '<div class="ctrl"><button class="btn" data-a="turn-add"'+(n>=8?' disabled':'')+'>+ Thêm lượt</button><button class="btn" data-a="turn-del"'+(n<=1?' disabled':'')+'>Bỏ lượt cuối</button></div>'+
  '<button class="btn primary" data-a="save-role">Lưu tình huống</button>';
}
const TABS=[['home','Hôm nay','home'],['drill','Luyện âm','wave'],['sent','Nhại câu','repeat'],['role','Hội thoại','chat'],['weak','Từ sai','flag']];
function show(){
  let h='';
  const v=V.view;
  if(v==='home') h=viewHome();
  else if(v==='drill') h=V.add?viewDrillAdd():V.card?viewCard():V.g?viewDrillGroup():viewDrillList();
  else if(v==='sent') h=V.add?viewSentAdd():V.card?viewCard():V.t?viewSentList():viewSentTopics();
  else if(v==='role') h=V.add?viewRoleAdd():V.sc&&P?viewRole():viewRoleList();
  else if(v==='weak') h=V.card&&P?viewCard():viewWeak();
  else if(v==='settings') h=viewSettings();
  $('#main').innerHTML=h;
  $('#tabs').innerHTML=TABS.map(t=>'<button class="tab" data-a="tab" data-v="'+t[0]+'"'+(t[0]===v?' aria-current="page"':'')+'>'+ico(t[2])+'<span>'+t[1]+'</span></button>').join('');
}

/* ====================== SỰ KIỆN ====================== */
function act(a,v,el){
  switch(a){
    case 'tab': return go({view:v});
    case 'back': return goBack();
    case 'settings': return go({view:'settings'});
    case 'drill-g': return go({view:'drill',g:v});
    case 'drill-i': return openCard('drill',V.g,+v);
    case 'sent-t': return go({view:'sent',t:v});
    case 'sent-i': return openCard('sent',V.t,+v);
    case 'weak-i': return openCard('weak',null,+v);
    case 'weak-all': return openCard('weak',null,0);
    case 'prev': return move(-1);
    case 'next': return move(1);
    case 'play': return speak(modelText(),false);
    case 'slow': return speak(modelText(),true);
    case 'say': return speak(v,false);
    case 'sayslow': return speak(v,true);
    case 'mic': return startListen();
    case 'rec': return toggleRec();
    case 'mine': return playUrl(P.mine);
    case 'cmp': return playUrl(P.mine,()=>speak(modelText(),false));
    case 'hide': P.hide=!P.hide; return show();
    case 'self': { P.self=true; const good=v==='1'; return handleSpoken(good?modelText():'…'); }
    case 'task': {
      const k=el.dataset.k;
      if(k==='drill') return go({view:'drill',g:v});
      if(k==='sent') return go({view:'sent',t:v});
      if(k==='role'){ const p=v.split(':'); return openRole(p[0],+p[1]); }
      return go({view:'weak'});
    }
    case 'role-open': { const p=v.split(':'); return openRole(p[0],+p[1]); }
    case 'role-p': return speak(P.sc.turns[P.turn].p,false);
    case 'role-say': return speak(P.sc.turns[P.turn].u,false);
    case 'role-keys': P.showKeys=true; return show();
    case 'role-sample': P.showSample=true; return show();
    case 'role-skip': case 'role-next': {
      const T=P.sc.turns[P.turn];
      const pass=a==='role-next'&&P.res?P.res.pass:false;
      P.log.push({p:T.p,said:a==='role-next'&&P.res&&!P.self?P.res.heard:(a==='role-next'&&P.res?T.u:''),pass:pass});
      if(pass) P.okCount++;
      P.turn++; P.res=null; P.msg=''; P.mine=null; P.live=''; P.showKeys=false; P.showSample=false; P.self=false;
      if(P.turn>=P.sc.turns.length){
        P.phase='end';
        if(P.okCount>=Math.ceil(P.sc.turns.length*0.6)) store.done['r:'+P.sc.id+':'+P.level]=1;
        save(); show(); window.scrollTo(0,0); return;
      }
      show(); window.scrollTo(0,0); return speak(P.sc.turns[P.turn].p,false);
    }
    case 'role-again': return openRole(P.sc.id,P.level);
    case 'role-up': return openRole(P.sc.id,P.level+1);
    case 'add-word': return go({view:'drill',add:true,g:v||''});
    case 'add-sent': return go({view:'sent',add:true,t:v||''});
    case 'role-add': D=newDraft(); return go({view:'role',add:true});
    case 'tr-word': return doTranslate('word',0,el);
    case 'tr-sent': return doTranslate('sent',0,el);
    case 'tr-rp': return doTranslate('rp',+v,el);
    case 'tr-ru': return doTranslate('ru',+v,el);
    case 'tr-test': return trTest();
    case 'copy-code': { try{ navigator.clipboard.writeText(AS_CODE).then(()=>toast('Đã sao chép mã.')).catch(()=>toast('Chưa sao chép được. Hãy chọn mã rồi sao chép thủ công.')); }catch(e){ toast('Chưa sao chép được. Hãy chọn mã rồi sao chép thủ công.'); } return; }
    case 'save-word': return saveWord();
    case 'save-sent': return saveSent();
    case 'save-role': return saveRole();
    case 'turn-add': collectDraft(); if(D&&D.turns.length<8) D.turns.push({p:'',u:'',uv:'',k:'',pv:''}); return show();
    case 'turn-del': collectDraft(); if(D&&D.turns.length>1) D.turns.pop(); return show();
    case 'del': {
      const kind=el.dataset.k, tag=kind+':'+v;
      if(pendingDel!==tag){ pendingDel=tag; return show(); }
      pendingDel=null;
      const c=store.custom;
      if(kind==='word') c.words=c.words.filter(x=>x.id!==v);
      else if(kind==='sent') c.sents=c.sents.filter(x=>x.id!==v);
      else if(kind==='role') c.roles=c.roles.filter(x=>x.id!==v);
      save(); toast('Đã xóa.'); return show();
    }
    case 'test-voice': return speak('Hello! Nice to meet you. Let us practice together.',false);
    case 'reset-ask': P=P||{}; P.confirm='reset'; return show();
    case 'wipe-ask': P=P||{}; P.confirm='wipe'; return show();
    case 'confirm-no': P=null; return show();
    case 'reset-do': store.start=today(); save(); P=null; toast('Đã bắt đầu lại từ tuần 1.'); return go({view:'home'});
    case 'wipe-do': store=defStore(); save(); applyTheme(); P=null; toast('Đã xóa dữ liệu.'); return go({view:'home'});
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  act(el.dataset.a,el.dataset.v,el);
});
function setSetting(k,val,live){
  if(k==='rate'){ store.settings.rate=parseFloat(val); const o=$('#rateval'); if(o) o.textContent=store.settings.rate.toFixed(1); }
  else if(k==='goal') store.settings.goal=parseInt(val,10);
  else if(k==='tr') store.settings.tr=String(val).trim();
  else store.settings[k]=val;
  if(k==='theme') applyTheme();
  save();
}
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-set]'); if(!el) return;
  setSetting(el.dataset.set,el.value,false);
  if(el.dataset.set==='accent'){ store.settings.voice=''; save(); show(); }
});
document.addEventListener('input',e=>{
  const el=e.target.closest('input[type=range][data-set]'); if(!el) return;
  setSetting(el.dataset.set,el.value,true);
});
window.addEventListener('pagehide',stopAll);

applyTheme();
show();
</script>
