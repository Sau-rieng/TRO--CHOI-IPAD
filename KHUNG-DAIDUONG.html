<title>Đại dương bao la 3D – Khung</title>
<!-- KHUNG ĐẠI DƯƠNG: lái tàu ngầm mini lặn từ rạn san hô cạn xuống vực thẳm, gặp 11 loài sinh vật biển.
     Câu hỏi, đăng nhập, đồng hồ, chấm điểm, khóa màn hình, kết quả do khung-chung.js lo (xem HUONG-DAN-KHUNG.md).
     11 trạm, lặn lần lượt 1 → 11: Cá hề · Hải quỳ → Sao biển → Cá ngựa → Rùa biển → Cá đuối → Sứa → Cá heo
     → Cá mập → Cá voi xanh → Mực khổng lồ → Cá cần câu (vực thẳm). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Cảnh 3D toàn màn hình. Góc trên trái/phải để trống cho khung (tên trò, Thoát, tiến độ, đồng hồ).
   Bảng câu hỏi của khung hiện bên phải (iPad ngang) hoặc ở dưới (điện thoại). Một giao diện tối (dưới nước). */
:root{
  --sea:#06314d; --ink:#e8f6fb; --muted:#9cc3d3;
  --panel:rgba(4,26,40,.8); --line:rgba(140,220,240,.25);
  --sol:#ffc44d; --ok:#5fd18b; --part:#e0a33a; --bad:#ff7d73;
  --f-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sea);color:var(--ink);font:15px/1.5 var(--f-body)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none;outline:none}
.hud{position:fixed;z-index:5;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px}

/* nhãn nổi trên sinh vật */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.nhan{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);text-shadow:0 0 6px #000;white-space:nowrap;transform:translate(-50%,-100%)}
.nhan b{display:grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#2c5468;color:#fff;font:700 11px var(--f-body);letter-spacing:0;text-shadow:none}
.nhan.tiep{color:var(--sol);font-size:12px} .nhan.tiep b{background:var(--sol);color:#1d1100;box-shadow:0 0 0 3px rgba(255,196,77,.35)}
.nhan.ok b{background:var(--ok)} .nhan.part b{background:var(--part)} .nhan.bad b{background:var(--bad)} .nhan.xong b{background:#5b7684}
.nhan.cho{opacity:.6}
.nhan.mep{opacity:.95}
.nhan i{font-style:normal;font-weight:500;opacity:.75;text-transform:none;letter-spacing:0}

/* gợi ý trạm tiếp theo (giữa, phía dưới) */
#goiY{left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:9px 16px;font-size:14px;text-align:center;max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goiY b{color:var(--sol)}
#loiNhan{left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:9px 16px;font-size:14px;text-align:center;max-width:min(620px,calc(100% - 28px))}
body.dangHoi #goiY,body.dangHoi #loiNhan,body.dangHoi #pad{display:none!important}
#loiNhan b{color:var(--sol)} #loiNhan .ok{color:var(--ok)} #loiNhan .bad{color:var(--bad)}

/* đồng hồ độ sâu (bên trái, giữa) */
/* bản đồ nhỏ: 11 trạm (đã làm / trạm tiếp theo / chưa làm) + vị trí tàu ngầm; nền càng sẫm càng sâu */
#banDo{left:12px;top:150px;padding:6px 6px 5px;text-align:center}
#banDo small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#banDo canvas{display:block;width:106px;height:300px;border-radius:8px}
#banDo .bdSau{font-size:12px;color:var(--muted);margin-top:3px} #banDo .bdSau b{color:var(--ink);font:700 14px var(--f-display)}
@media (max-height:600px){#banDo small{display:none}}

/* phím tắt (máy tính) */
#phim{left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto auto;gap:2px 8px;padding:8px 10px;color:var(--muted);font-size:11px;white-space:nowrap}
#phim kbd{font:600 10px var(--f-body);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (pointer:coarse),(max-width:820px){#phim{display:none!important}}

/* nút điều khiển cảm ứng */
#pad{right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:6px}
#pad button{padding:0;font:600 20px var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;line-height:1.05}
#pad button:active,#pad button.giu{background:rgba(255,196,77,.28);border-color:var(--sol)}
#pad .nho{font-size:12px;color:var(--muted)}
#pad .nhanh{grid-column:1/4;font-size:14px}
@media (pointer:fine) and (min-width:821px){#pad{display:none!important}}
@media (max-width:820px){#goiY{bottom:calc(196px + env(safe-area-inset-bottom,0px))}#loiNhan{bottom:calc(244px + env(safe-area-inset-bottom,0px))}}
@media (max-width:820px) and (max-height:520px){#goiY{left:12px;transform:none;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 220px)}#loiNhan{left:12px;transform:none;bottom:calc(62px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 220px)}}
</style>

<body>

<div id="stage"></div>
<div id="labels"></div>

<div class="hud" id="banDo" hidden aria-label="Bản đồ 11 trạm"><small>Bản đồ trạm</small><canvas id="bdCv" width="184" height="520"></canvas><div class="bdSau">Sâu <b id="sauSo">0 m</b></div></div>

  <button class="nho" data-k="rise" aria-label="Nổi lên">⤒<br>Nổi</button><button data-k="up" aria-label="Chạy tới">▲</button><button class="nho" data-k="sink" aria-label="Lặn xuống">⤓<br>Lặn</button>
  <button data-k="left" aria-label="Rẽ trái">◀</button><button data-k="down" aria-label="Lùi">▼</button><button data-k="right" aria-label="Rẽ phải">▶</button>
  <button class="nhanh" data-k="boost" aria-label="Tăng tốc">⚡ Tăng tốc</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- 4 dòng nối: KHÔNG XÓA, KHÔNG ĐỔI THỨ TỰ -->
<script src="https://sau-rieng.github.io/LAM-BAI-KIEM-TRA/cau-hinh-lop.js" data-banner="khong"></script>
<script src="noi-so-theo-doi.js"></script>

<script>
(()=>{"use strict";
/* ████████ VÙNG CẢNH + DI CHUYỂN – ĐƯỢC SỬA TỰ DO ████████ */
const $=id=>document.getElementById(id);
const PI=Math.PI;
function rnd(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}
const R=rnd(20261124),rr=(a,b)=>a+R()*(b-a);
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ================= ĐÁY BIỂN =================
// đi về phía -z: rạn san hô cạn (≈18 m) → sườn dốc → vực thẳm (≈92 m), hai bên là vách hẻm vực
function dayY(x,z){
  const d=-z;let y=-18-24*ss(150,262,d)-50*ss(262,292,d);
  if(d>250)y+=Math.min(55,Math.max(0,Math.abs(x)-30)*1.3)*ss(250,290,d);
  if(Math.abs(x)>60)y+=(Math.abs(x)-60)*.35;
  return y+Math.sin(x*.13)*Math.sin(z*.11)*1.6+Math.sin(x*.37+z*.21)*.6+Math.sin(z*.05+x*.02)*1.2;
}
const BIEN={x:40,zMax:24,zMin:-368,hanhLang:22};

// ================= TIỆN ÍCH HÌNH =================
function tex(draw,w=256,h=256){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return new THREE.CanvasTexture(c)}
function radial(stops){return tex((g,w,h)=>{const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);stops.forEach(([o,c])=>gr.addColorStop(o,c));g.fillStyle=gr;g.fillRect(0,0,w,h)},128,128)}
const _C=new THREE.Color(),_D=new THREE.Color();
// part: một mảnh hình (đã đặt vị trí/xoay/co giãn) kèm màu đỉnh; merge: gộp nhiều mảnh thành 1 hình → ít lệnh vẽ
function part(geo,col,p,r,s){
  p=p||[0,0,0];r=r||[0,0,0];s=s||[1,1,1];
  const g=geo.index?geo.toNonIndexed():geo.clone();
  g.applyMatrix4(new THREE.Matrix4().compose(new THREE.Vector3(...p),new THREE.Quaternion().setFromEuler(new THREE.Euler(...r)),new THREE.Vector3(...s)));
  const P=g.attributes.position,N=g.attributes.normal,n=P.count,c=new Float32Array(n*3);
  for(let i=0;i<n;i++){if(typeof col==='function')col(P.getX(i),P.getY(i),P.getZ(i),N.getX(i),N.getY(i),N.getZ(i),_C);else _C.set(col);c[i*3]=_C.r;c[i*3+1]=_C.g;c[i*3+2]=_C.b}
  const o=new THREE.BufferGeometry();o.setAttribute('position',P);o.setAttribute('normal',N);o.setAttribute('color',new THREE.BufferAttribute(c,3));return o;
}
function merge(list){
  let n=0;list.forEach(g=>n+=g.attributes.position.count);
  const P=new Float32Array(n*3),N=new Float32Array(n*3),C=new Float32Array(n*3);let o=0;
  list.forEach(g=>{P.set(g.attributes.position.array,o);N.set(g.attributes.normal.array,o);C.set(g.attributes.color.array,o);o+=g.attributes.position.count*3});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('normal',new THREE.BufferAttribute(N,3));g.setAttribute('color',new THREE.BufferAttribute(C,3));g.computeBoundingSphere();return g;
}
const VM=new THREE.MeshLambertMaterial({vertexColors:true});
const VM2=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide});
const mesh=(list,mat=VM)=>new THREE.Mesh(merge(list),mat);
const SPH=new THREE.SphereGeometry(1,20,14),SPL=new THREE.SphereGeometry(1,10,8),CYL=new THREE.CylinderGeometry(1,1,1,12),CONE=new THREE.ConeGeometry(1,1,12);
const HEMI=new THREE.SphereGeometry(1,22,10,0,PI*2,0,PI/2);
// hình ít mặt cho vật lặp nhiều (san hô, đàn cá) → nhẹ cho iPad đời cũ
const SPX=new THREE.SphereGeometry(1,6,4),CYX=new THREE.CylinderGeometry(1,1,1,5,1,true),CONX=new THREE.ConeGeometry(1,1,4,1,true),HEMX=new THREE.SphereGeometry(1,12,6,0,PI*2,0,PI/2);
// màu theo mặt: lưng sẫm, bụng sáng (như cá thật)
const lungBung=(lung,bung,a=-.1,b=-.5)=>(x,y,z,nx,ny,nz,C)=>C.set(lung).lerp(_D.set(bung),ss(a,b,ny));
const grp=(...k)=>{const g=new THREE.Group();k.forEach(o=>g.add(o));return g};
const piv=(obj,x,y,z)=>{const g=new THREE.Group();g.position.set(x,y,z);g.add(obj);return g};

// ================= CẢNH =================
let PR=Math.min(devicePixelRatio||1,1.5);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(PR);renderer.setSize(innerWidth,innerHeight);
$('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const U={uT:{value:0}};   // thời gian chung cho shader (rong lắc, cá quẫy, ánh nắng đáy biển)
const MAU_NONG=new THREE.Color(0x26a6cf),MAU_GIUA=new THREE.Color(0x0b4f7a),MAU_SAU=new THREE.Color(0x020a16),mauNuoc=new THREE.Color();
scene.fog=new THREE.FogExp2(MAU_NONG.getHex(),.018);
renderer.setClearColor(MAU_NONG);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,190);
camera.position.set(0,-8,30);
const hemi=new THREE.HemisphereLight(0xa8ecff,0x1d3b4a,1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xe8fbff,.7);sun.position.set(20,60,10);scene.add(sun);

// đáy biển
const causticTex=tex((g,w,h)=>{const im=g.createImageData(w,h),f=PI*2/w;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=Math.sin(f*x*3+1.6*Math.sin(f*y*2))+Math.sin(f*y*3+1.6*Math.sin(f*x*2+1)),v2=Math.sin(f*(x+y)*2+1.2*Math.sin(f*(x-y)*3));
    const b=.68+.32*Math.max(Math.exp(-v*v*6),Math.exp(-v2*v2*8)*.8),k=(y*w+x)*4;im.data[k]=im.data[k+1]=im.data[k+2]=b*255;im.data[k+3]=255}
  g.putImageData(im,0,0)});
causticTex.wrapS=causticTex.wrapT=THREE.RepeatWrapping;causticTex.repeat.set(18,42);
const floorTex=tex((g,w,h)=>{const im=g.createImageData(w,h),f=PI*2/w,r=rnd(8);   // cát gợn sóng + hạt cát
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const gs=Math.sin(f*y*6+1.4*Math.sin(f*x*2)+.6*Math.sin(f*x*5));const b=.8+.13*gs*gs*Math.sign(gs)+(r()-.5)*.14,k=(y*w+x)*4;
    im.data[k]=Math.min(255,b*255);im.data[k+1]=Math.min(255,b*250);im.data[k+2]=Math.min(255,b*238);im.data[k+3]=255}
  g.putImageData(im,0,0)});
floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping;floorTex.repeat.set(36,80);
const dayMat=new THREE.MeshLambertMaterial({vertexColors:true,map:floorTex});
dayMat.onBeforeCompile=sh=>{sh.uniforms.uT=U.uT;
  sh.vertexShader='varying vec3 vWp;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvWp=(modelMatrix*vec4(transformed,1.)).xyz;');
  sh.fragmentShader='uniform float uT;varying vec3 vWp;\nfloat caus(vec2 p,float t){vec2 i=p;float c=1.;for(int n=0;n<3;n++){float tt=t*(1.-(3.5/float(n+1)));i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));c+=1./length(vec2(p.x/(sin(i.x+tt)/.005),p.y/(cos(i.y+tt)/.005)));}c/=3.;c=1.17-pow(c,1.4);return pow(abs(c),8.);}\n'+
    sh.fragmentShader.replace('#include <map_fragment>','#include <map_fragment>\nfloat fd=clamp(1.-(-vWp.y-12.)/40.,0.,1.);diffuseColor.rgb*=.9+.32*min(caus(vWp.xz*.28,uT*.45),1.)*fd;')};
{
  const g=new THREE.PlaneGeometry(200,440,100,220);g.rotateX(-PI/2);g.translate(0,0,-180);
  const P=g.attributes.position,c=new Float32Array(P.count*3),cs=new THREE.Color(0xd2bd8c),cm=new THREE.Color(0x8c8270),cd=new THREE.Color(0x2c3038),r=rnd(5);
  for(let i=0;i<P.count;i++){const x=P.getX(i),z=P.getZ(i),y=dayY(x,z);P.setY(i,y);
    const k=ss(-18,-90,y),n=.92+r()*.16;_C.copy(cs);
    // mảng màu: cát hồng, rêu xanh, sỏi sẫm ở vùng cạn → đáy sinh động hơn
    const m1=Math.sin(x*.09+z*.05)*Math.sin(z*.07-x*.03),m2=Math.sin(x*.05-z*.11+1.7),m3=Math.sin(x*.21)*Math.sin(z*.19);
    if(m1>.35)_C.lerp(_D.set(0xe9b9a0),Math.min(1,(m1-.35)*2.5));if(m2>.55)_C.lerp(_D.set(0x9fbf6a),Math.min(.8,(m2-.55)*2.5));if(m3>.6)_C.lerp(_D.set(0x8f8576),(m3-.6)*1.8);
    _C.lerp(cm,Math.min(1,k*2)).lerp(cd,Math.max(0,k*2-1));c.set([_C.r*n,_C.g*n,_C.b*n],i*3)}
  g.setAttribute('color',new THREE.BufferAttribute(c,3));g.computeVertexNormals();
  scene.add(new THREE.Mesh(g,dayMat));
}
// mặt nước nhìn từ dưới lên + tia nắng
const matMat=new THREE.MeshBasicMaterial({color:0x9ff0ff,map:causticTex,transparent:true,opacity:.75,side:THREE.DoubleSide,depthWrite:false});
{const m=new THREE.Mesh(new THREE.PlaneGeometry(500,800),matMat);m.rotation.x=PI/2;m.position.set(0,0,-180);scene.add(m)}
const tiaTex=tex((g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(220,250,255,.9)');gr.addColorStop(.5,'rgba(180,240,255,.25)');gr.addColorStop(1,'rgba(180,240,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,w,h);const g2=g.createLinearGradient(0,0,w,0);g2.addColorStop(0,'rgba(0,0,0,1)');g2.addColorStop(.5,'rgba(0,0,0,0)');g2.addColorStop(1,'rgba(0,0,0,1)');
  g.globalCompositeOperation='destination-out';g.fillStyle=g2;g.fillRect(0,0,w,h)},64,256);
const tia=[];
for(let i=0;i<16;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(rr(3,7),34),new THREE.MeshBasicMaterial({map:tiaTex,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  m.position.set(rr(-35,35),-15,rr(20,-230));m.rotation.z=rr(-.15,.15);m.userData.ph=R()*9;scene.add(m);tia.push(m)}
// tuyết biển (hạt lơ lửng)
{const n=5000,p=new Float32Array(n*3);for(let i=0;i<n;i++)p.set([rr(-80,80),rr(-95,-1),rr(30,-395)],i*3);
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:.12,color:0xd8f0f8,transparent:true,opacity:.55,depthWrite:false})))}
// đốm phát quang dưới vực thẳm
const phatQuang=(()=>{const n=420,p=new Float32Array(n*3),c=new Float32Array(n*3),cols=[[.3,1,.95],[.35,.6,1],[.5,1,.5]];
 for(let i=0;i<n;i++){const z=rr(-275,-395),x=rr(-40,40);p.set([x,rr(dayY(x,z)+1,-35),z],i*3);c.set(cols[i%3],i*3)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
 const m=new THREE.Points(g,new THREE.PointsMaterial({size:.35,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));scene.add(m);return m})();

// ---------- đá, san hô, rong (InstancedMesh: vật lặp nhiều chỉ vẽ một lần) ----------
const dum=new THREE.Object3D();
