<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Escape the Cartoon Forest - Hóa Học 12</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #9bd4e4; -webkit-user-select: none; user-select: none; touch-action: none;}
        #game-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #game-container canvas { width: 100% !important; height: 100% !important; display: block; outline: none;}
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-box { background: white; padding: 30px 20px; border-radius: 15px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.6); border: 6px solid #f1c40f; width: 85%; max-width: 400px; }
        .login-box h2 { color: #2c3e50; margin-top: 0; font-size: 24px; text-transform: uppercase; }
        .login-box p { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        
        .login-box input, .login-box select { 
            width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #bdc3c7; 
            border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; 
            transition: border 0.3s; user-select: auto; -webkit-user-select: auto;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-box select { cursor: pointer; background-color: #fcfcfc; }
        .login-box input:focus, .login-box select:focus { border-color: #3498db; }
        
        .login-box button { background: #e74c3c; color: white; padding: 15px; width: 100%; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.2s;}
        .login-box button:hover { background: #c0392b; }
        .login-box button:active { transform: scale(0.98); }

        /* Giao diện khi bị khóa */
        #locked-msg { display: none; color: #e74c3c; font-size: 18px; font-weight: bold; margin: 20px 0; border: 2px dashed #e74c3c; padding: 15px; border-radius: 8px; background: #fadbd8; }
        #btn-unlock { display: none; background: #7f8c8d; font-size: 16px; margin-top: 10px;}
        #btn-unlock:hover { background: #95a5a6; }

        #result-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 9999; display: none; justify-content: center; align-items: center; }
        .result-box { background: white; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border: 6px solid #f1c40f; width: 85%; max-width: 450px;}
        #result-title { margin-top: 0; font-size: 32px; font-weight: bold; }
        .result-box p { color: #2c3e50; font-size: 20px; margin: 12px 0; font-weight: bold; }
        .result-box .info-text { font-size: 16px; color: #27ae60; margin-top: 20px; margin-bottom: 10px; font-weight: bold;}

        #toast-msg { position: fixed; top: 30%; left: 50%; transform: translateX(-50%); background: rgba(231, 76, 60, 0.95); color: white; padding: 15px 30px; border-radius: 30px; font-size: 18px; font-weight: bold; z-index: 5000; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: none; text-align: center; border: 2px solid #fff; }

        #player-info { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(52, 152, 219, 0.95); color: white; padding: 10px 20px; border-radius: 10px; font-size: 16px; font-weight: bold; z-index: 5; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; text-align: center; line-height: 1.5; }

        #ui-panel { position: absolute; bottom: -400px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 700px; background: rgba(40, 50, 60, 0.95); color: white; box-shadow: 0 -5px 20px rgba(0,0,0,0.6); transition: bottom 0.3s ease-out; display: flex; flex-direction: column; align-items: center; padding: 15px 20px 25px 20px; z-index: 20; border-radius: 20px 20px 0 0; border-top: 5px solid #ffcc00; }
        #ui-panel.active { bottom: 0; }
        #question-text { font-size: 18px; margin-bottom: 15px; text-align: center; color: #ffcc00; font-weight: bold; }
        #answers-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .btn-answer { background: #4CAF50; color: white; border: 2px solid #388E3C; padding: 15px; font-size: 16px; border-radius: 10px; cursor: pointer; font-weight: bold;}
        .btn-answer:active { background: #45a049; transform: scale(0.98); }
        
        #instructions { position: absolute; top: 15px; left: 15px; color: white; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 10px; z-index: 5; pointer-events: none; }
        #instructions h2 { margin: 0 0 5px 0; font-size: 18px; color: #ffcc00;}
        #instructions p { margin: 0; font-size: 14px; }

        #audio-control { position: absolute; top: 15px; left: 240px; color: white; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 10px; z-index: 5; font-size: 14px; cursor: pointer; font-weight: bold; border: 2px solid #3498db; }
        #audio-control:active { transform: scale(0.95); }

        #timer-box { position: absolute; top: 15px; right: 15px; color: white; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; z-index: 5; font-size: 24px; font-weight: bold; border: 2px solid #ffcc00; font-family: monospace; pointer-events: none; text-align: center;}
        
        #score-box { position: absolute; top: 65px; right: 15px; color: white; background: rgba(39, 174, 96, 0.85); padding: 5px 15px; border-radius: 10px; z-index: 5; font-size: 20px; font-weight: bold; border: 2px solid #2ecc71; display: none; pointer-events: none;}

        .floating-score { position: absolute; color: #2ecc71; font-size: 36px; font-weight: bold; text-shadow: 0 0 10px white, 0 0 5px green; pointer-events: none; animation: floatUp 1.5s ease-out forwards; z-index: 100; transform: translate(-50%, -50%);}
        @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -150px) scale(1.5); } }

        #dpad { position: absolute; bottom: 30px; left: 30px; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .dpad-row { display: flex; gap: 5px; }
        .dpad-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(255, 255, 255, 0.6); border: 3px solid rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; font-size: 24px; color: #333; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); user-select: none; -webkit-user-select: none; touch-action: none; }
        .dpad-btn:active { background: rgba(255, 204, 0, 0.8); transform: scale(0.95); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="toast-msg"></div>

    <div id="login-screen">
        <form class="login-box" id="login-form" onsubmit="startGame(); return false;">
            <h2>Hóa Học 12: Chương 1-2-3</h2>
            <p id="login-desc">Vui lòng điền thông tin để bắt đầu</p>
            
            <div id="locked-msg">🔒 Thiết bị này đã nộp bài.<br>Không thể thi lại lần 2.</div>

            <div id="input-group">
                <input type="text" id="input-name" placeholder="Họ và Tên Học Sinh" autocomplete="off" required>
                <select id="input-class" required>
                    <option value="" disabled selected>-- Chọn Lớp --</option>
                    <option value="10E1">Lớp 10E1</option>
                    <option value="12G1">Lớp 12G1</option>
                    <option value="12G2">Lớp 12G2</option>
                    <option value="12G5">Lớp 12G5</option>
                    <option value="9D1">Lớp 9D1</option>
                    <option value="9D3">Lớp 9D3</option>
                </select>
                <input type="text" id="input-id" placeholder="Số Báo Danh (Ví dụ: 01)" autocomplete="off" required>
            </div>

            <button type="submit" id="btn-start">BẮT ĐẦU CHƠI</button>
            <button type="button" id="btn-unlock" onclick="unlockGame()">🔓 MỞ KHÓA (GIÁO VIÊN)</button>
        </form>
    </div>

    <div id="result-screen">
        <div class="result-box">
            <h2 id="result-title"></h2>
            <div id="result-details"></div>
            <!-- Bỏ nút "Chơi lại từ đầu" để tránh hs tự bấm chơi lại -->
            <button onclick="location.reload()" style="background:#7f8c8d">THOÁT</button>
        </div>
    </div>

    <div id="game-container"></div>
    <div id="player-info">Người chơi: Đang tải...</div>

    <div id="timer-box">05:00</div>
    <div id="score-box">⭐ Điểm: 0</div>

    <div id="instructions">
        <h2>Hóa Học 12: Ôn Tập</h2>
        <p>Điều khiển phím ảo để đi.</p>
    </div>
    
    <div id="audio-control" onclick="toggleAudio()">🔊 Bật Nhạc</div>

    <div id="dpad">
        <div class="dpad-btn" id="btn-up">▲</div>
        <div class="dpad-row">
            <div class="dpad-btn" id="btn-left">◀</div>
            <div class="dpad-btn" id="btn-down">▼</div>
            <div class="dpad-btn" id="btn-right">▶</div>
        </div>
    </div>

    <div id="ui-panel">
        <div id="question-text">Câu hỏi?</div>
        <div id="answers-container"></div>
    </div>

    <script>
        // === DÁN ĐƯỜNG DẪN GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY ===
        const GOOGLE_SHEET_URL = "DÁN_URL_CỦA_BẠN_VÀO_ĐÂY";

        function sendScoreToSheet(name, id, score, seconds) {
            if (GOOGLE_SHEET_URL.includes("DÁN_URL")) return; 
            fetch(GOOGLE_SHEET_URL, {
                method: "POST", mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: name, id: id, score: score, time: seconds })
            }).catch(err => console.log("Lỗi gửi dữ liệu: ", err));
        }

        // KIỂM TRA MÃ KHÓA KHI TẢI TRANG
        window.onload = function() {
            if(localStorage.getItem('daThiHoa12') === 'true') {
                document.getElementById('input-group').style.display = 'none';
                document.getElementById('btn-start').style.display = 'none';
                document.getElementById('login-desc').style.display = 'none';
                document.getElementById('locked-msg').style.display = 'block';
                document.getElementById('btn-unlock').style.display = 'block';
            }
        }

        // HÀM NHẬP MÃ PIN GIÁO VIÊN
        function unlockGame() {
            let pin = prompt("Vui lòng nhập MÃ BẢO MẬT của Giáo Viên:");
            if (pin === "123456") { // Đổi mã số bảo mật ở đây nếu muốn
                localStorage.removeItem('daThiHoa12');
                alert("Mở khóa thành công! Học sinh có thể làm lại bài.");
                location.reload();
            } else if (pin !== null) {
                alert("Mã bảo mật không chính xác!");
            }
        }

        const bgMusic = new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-17.mp3");
        bgMusic.loop = true; bgMusic.volume = 0.2; 
        const sfxCorrect = new Audio("https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3");
        const sfxWrong = new Audio("https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3");
        const sfxWin = new Audio("https://assets.mixkit.co/active_storage/sfx/2002/2002-preview.mp3");
        const sfxExplode = new Audio("https://assets.mixkit.co/active_storage/sfx/170/170-preview.mp3");

        let isMuted = false;
        function toggleAudio() {
            isMuted = !isMuted;
            bgMusic.muted = isMuted; sfxCorrect.muted = isMuted; sfxWrong.muted = isMuted; sfxWin.muted = isMuted; sfxExplode.muted = isMuted;
            document.getElementById('audio-control').innerText = isMuted ? "🔇 Tắt Nhạc" : "🔊 Bật Nhạc";
        }

        let toastTimeout;
        function showToast(msg, bgColor = "rgba(231, 76, 60, 0.95)") {
            const toast = document.getElementById('toast-msg');
            toast.innerText = msg; toast.style.background = bgColor; toast.style.display = 'block';
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        const bank1 = [
            { q: "Công thức chung của ester no, đơn chức, mạch hở là?", a: ["CnH2nO2 (n≥2)", "CnH2nO (n≥1)", "CnH2n-2O2 (n≥3)", "CnH2n+2O2 (n≥2)"], c: 0 },
            { q: "Tên gọi của ester CH3COOC2H5 là?", a: ["Ethyl acetate", "Methyl acetate", "Propyl acetate", "Ethyl formate"], c: 0 },
            { q: "Phản ứng xà phòng hóa ester là phản ứng thủy phân trong môi trường nào?", a: ["Acid", "Base (Kiềm)", "Muối trung tính", "Nước nguyên chất"], c: 1 },
            { q: "Ở điều kiện thường, chất béo tồn tại ở trạng thái lỏng thường chứa gốc acid béo loại nào?", a: ["No", "Không no", "Thơm", "Vòng"], c: 1 },
            { q: "Ester sinh ra từ phản ứng giữa acid CH3COOH và cồn CH3OH là?", a: ["CH3COOCH3", "HCOOCH3", "CH3COOC2H5", "C2H5COOCH3"], c: 0 },
            { q: "Chất béo là triester của glycerol với?", a: ["Acid vô cơ", "Acid đa chức", "Acid béo", "Amino acid"], c: 2 },
            { q: "Phản ứng biến chất béo lỏng thành chất béo rắn (bơ nhân tạo) là phản ứng gì?", a: ["Xà phòng hóa", "Cộng hydrogen (H2)", "Thủy phân", "Trùng hợp"], c: 1 },
            { q: "Ester nào sau đây có mùi chuối chín đặc trưng?", a: ["Isoamyl acetate", "Benzyl acetate", "Ethyl butyrate", "Geranyl acetate"], c: 0 },
            { q: "Trạng thái tồn tại của phần lớn các ester ở điều kiện thường là?", a: ["Chất rắn", "Chất lỏng", "Chất khí", "Plasma"], c: 1 },
            { q: "Lipid bao gồm các chất nào sau đây?", a: ["Chất béo, sáp, steroid, phospholipid", "Chỉ gồm chất béo", "Chỉ gồm sáp và steroid", "Dầu ăn và mỡ động vật"], c: 0 }
        ];

        const bank2 = [
            { q: "Carbohydrate được chia thành mấy nhóm chủ yếu?", a: ["2 nhóm", "3 nhóm", "4 nhóm", "5 nhóm"], c: 1 },
            { q: "Công thức phân tử của glucose và fructose là?", a: ["C6H12O6", "C12H22O11", "(C6H10O5)n", "C6H12O5"], c: 0 },
            { q: "Chất nào sau đây thuộc loại monosaccharide?", a: ["Saccharose", "Maltose", "Fructose", "Cellulose"], c: 2 },
            { q: "Phân tử Saccharose được cấu tạo từ?", a: ["2 gốc α-glucose", "1 gốc α-glucose và 1 gốc β-fructose", "2 gốc β-fructose", "Nhiều gốc glucose"], c: 1 },
            { q: "Dung dịch glucose có phản ứng tráng bạc vì trong phân tử có chứa nhóm chức nào?", a: ["Hydroxyl (-OH)", "Carboxyl (-COOH)", "Aldehyde (-CHO)", "Ketone (>C=O)"], c: 2 },
            { q: "Chất nào sau đây KHÔNG bị thủy phân trong môi trường acid?", a: ["Saccharose", "Tinh bột", "Cellulose", "Glucose"], c: 3 },
            { q: "Cellulose (thành phần chính của gỗ, bông) thuộc loại hợp chất nào?", a: ["Monosaccharide", "Disaccharide", "Polysaccharide", "Lipid"], c: 2 },
            { q: "Để nhận biết hồ tinh bột, người ta dùng thuốc thử nào sau đây?", a: ["Dung dịch I2 (Iodine)", "AgNO3/NH3", "Cu(OH)2", "Quỳ tím"], c: 0 },
            { q: "Đặc điểm nào sau đây KHÔNG đúng với tinh bột?", a: ["Dạng bột vô định hình", "Màu trắng", "Tan nhiều trong nước lạnh", "Không tan trong nước lạnh"], c: 2 },
            { q: "Nước ép quả nho chín chứa rất nhiều chất nào sau đây (còn gọi là đường nho)?", a: ["Fructose", "Glucose", "Saccharose", "Maltose"], c: 1 }
        ];

        const bank3 = [
            { q: "Amine bậc 1 có nhóm chức nào sau đây?", a: ["-NH2", "-NH-", ">N-", "-COOH"], c: 0 },
            { q: "Tên gốc - chức của amine CH3NH2 là?", a: ["Methylamine", "Ethylamine", "Propylamine", "Phenylamine"], c: 0 },
            { q: "Chất nào sau đây là một amine thơm?", a: ["Methylamine", "Ethylamine", "Aniline (C6H5NH2)", "Dimethylamine"], c: 2 },
            { q: "Amino acid là hợp chất hữu cơ tạp chức chứa đồng thời các nhóm chức nào?", a: ["-NH2 và -COOH", "-OH và -COOH", "-NH2 và -OH", "-CHO và -COOH"], c: 0 },
            { q: "Công thức của Glycine (amino acid nhỏ nhất) là?", a: ["H2N-CH2-COOH", "CH3-CH(NH2)-COOH", "H2N-CH2-CH2-COOH", "CH3-CH2-COOH"], c: 0 },
            { q: "Chất nào sau đây có tính lưỡng tính (tác dụng được với cả acid và base)?", a: ["CH3NH2", "CH3COOH", "H2N-CH2-COOH", "C2H5OH"], c: 2 },
            { q: "Liên kết peptide là liên kết -CO-NH- giữa hai đơn vị nào?", a: ["α-amino acid", "β-amino acid", "Carboxylic acid", "Amine"], c: 0 },
            { q: "Phản ứng màu biuret dùng thuốc thử Cu(OH)2 trong môi trường kiềm cho màu gì?", a: ["Đỏ máu", "Vàng cam", "Tím đặc trưng", "Xanh lam"], c: 2 },
            { q: "Peptide mạch hở chứa 3 gốc α-amino acid được gọi là gì?", a: ["Dipeptide", "Tripeptide", "Tetrapeptide", "Polypeptide"], c: 1 },
            { q: "Sự đông tụ protein (như luộc trứng, nấu riêu cua) xảy ra khi nào?", a: ["Khi đun nóng", "Khi thêm acid", "Khi thêm base hoặc muối", "Cả 3 trường hợp trên"], c: 3 }
        ];

        const bank4 = [
            { q: "Ở nhiệt độ thường, chất béo triolein tồn tại ở trạng thái nào?", a: ["Rắn", "Lỏng", "Khí", "Nhũ tương"], c: 1 },
            { q: "Chất nào sau đây là chất rắn, dạng sợi, màu trắng, không tan trong nước?", a: ["Tinh bột", "Saccharose", "Cellulose", "Glucose"], c: 2 },
            { q: "Dung dịch chất nào sau đây làm quỳ tím hóa xanh (có tính base)?", a: ["Aniline", "Glycine", "Methylamine", "Valine"], c: 2 },
            { q: "Dung dịch acid aminoacetic (Glycine) làm quỳ tím chuyển màu gì?", a: ["Đỏ", "Xanh", "Không đổi màu", "Mất màu"], c: 2 },
            { q: "Cho AgNO3/NH3 vào ống nghiệm chứa glucose đun nóng nhẹ sẽ thấy hiện tượng gì?", a: ["Kết tủa đỏ gạch", "Lớp kim loại trắng bạc bám vào thành ống", "Sủi bọt khí", "Dung dịch màu xanh thẫm"], c: 1 },
            { q: "Sản phẩm thủy phân hoàn toàn tinh bột trong môi trường acid đun nóng là?", a: ["Fructose", "Glucose", "Saccharose", "Maltose"], c: 1 },
            { q: "Chất béo là thành phần chính của?", a: ["Mật ong", "Dầu, mỡ động thực vật", "Gỗ", "Tóc và móng sừng"], c: 1 },
            { q: "Fructose (đường ngọt nhất) có mặt nhiều nhất trong?", a: ["Quả nho chín", "Mật ong", "Cây mía", "Cây bông"], c: 1 },
            { q: "Tơ tằm, lông cừu, tóc, sừng thuộc loại hợp chất nào?", a: ["Polysaccharide", "Protein", "Lipid", "Ester"], c: 1 },
            { q: "Xà phòng là hỗn hợp muối Natri hoặc Kali của hợp chất nào?", a: ["Acid vô cơ", "Acid carboxylic đơn giản", "Acid béo", "Amino acid"], c: 2 }
        ];

        const bank5 = [
            { q: "Ester Vinyl acetate có công thức cấu tạo là?", a: ["CH3COOCH=CH2", "CH2=CHCOOCH3", "HCOOCH=CH2", "C2H5COOCH=CH2"], c: 0 },
            { q: "Chất nào sau đây là đồng phân của glucose?", a: ["Saccharose", "Fructose", "Cellulose", "Tinh bột"], c: 1 },
            { q: "Công thức phân tử của chất béo Triolein là?", a: ["(C17H35COO)3C3H5", "(C15H31COO)3C3H5", "(C17H33COO)3C3H5", "(C17H31COO)3C3H5"], c: 2 },
            { q: "Amine bậc 2 có công thức cấu tạo dạng chung là?", a: ["R-NH2", "R-NH-R'", "R-N(R')-R''", "R-NO2"], c: 1 },
            { q: "Số liên kết peptide có trong phân tử Tetrapeptide mạch hở là bao nhiêu?", a: ["4", "3", "2", "5"], c: 1 },
            { q: "Alanine (một amino acid) có công thức cấu tạo thu gọn là?", a: ["H2N-CH2-COOH", "CH3-CH(NH2)-COOH", "HOOC-CH2-CH2-CH(NH2)-COOH", "H2N-[CH2]4-CH(NH2)-COOH"], c: 1 },
            { q: "Phân tử Amylopectin (trong tinh bột) có cấu trúc mạch như thế nào?", a: ["Mạch không phân nhánh", "Mạch phân nhánh", "Mạch vòng khép kín", "Mạng không gian"], c: 1 },
            { q: "Amine nào sau đây tồn tại ở trạng thái khí ở điều kiện thường?", a: ["Aniline", "Dimethylamine", "Phenylamine", "Benzylamine"], c: 1 },
            { q: "Chất nào sau đây tác dụng được với Cu(OH)2 ở nhiệt độ thường tạo dung dịch màu xanh lam?", a: ["Ethanol", "Fructose", "Ethyl acetate", "Cellulose"], c: 1 },
            { q: "Lysine có đặc điểm cấu tạo chứa mấy nhóm amino (-NH2) và mấy nhóm carboxyl (-COOH)?", a: ["1 nhóm -NH2 và 1 nhóm -COOH", "2 nhóm -NH2 và 1 nhóm -COOH", "1 nhóm -NH2 và 2 nhóm -COOH", "2 nhóm -NH2 và 2 nhóm -COOH"], c: 1 }
        ];

        const allQuestionBanks = [bank1, bank2, bank3, bank4, bank5];

        let activeQuestions = []; 
        let playerName = ""; let playerId = ""; let gameStarted = false; 
        let currentScore = 0; 

        function generateRandomizedQuestions() {
            let selectedBank = allQuestionBanks[Math.floor(Math.random() * allQuestionBanks.length)];
            let cloned = JSON.parse(JSON.stringify(selectedBank));
            for (let i = cloned.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
            }
            cloned.forEach(item => {
                let correctAnswerText = item.a[item.c]; 
                for (let i = item.a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [item.a[i], item.a[j]] = [item.a[j], item.a[i]];
                }
                item.c = item.a.indexOf(correctAnswerText);
            });
            return cloned;
        }

        function updateScoreUI() {
            document.getElementById('score-box').innerText = `⭐ Điểm: ${currentScore}`;
        }

        function startGame() {
            const nameInput = document.getElementById('input-name').value.trim();
            const classInput = document.getElementById('input-class').value;
            const idInput = document.getElementById('input-id').value.trim();
            
            if(nameInput === "" || classInput === "" || idInput === "") { showToast("Vui lòng điền đủ Tên, Lớp và SBD!"); return false; }
            playerName = nameInput; 
            playerId = classInput + " - " + idInput; 
            currentScore = 0;
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('player-info').style.display = 'block';
            document.getElementById('score-box').style.display = 'block';
            document.getElementById('player-info').innerText = `${playerName} | Lớp: ${classInput} | SBD: ${idInput}`;
            updateScoreUI();
            
            if(!isMuted) bgMusic.play().catch(e => console.log("Trình duyệt chặn autoplay audio"));

            gameStartTime = Date.now(); gameStarted = true; return false;
        }

        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9bd4e4); 
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: false }); renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xfff5b6, 0.6); dirLight.position.set(20, 50, 20); scene.add(dirLight);

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 1000), new THREE.MeshLambertMaterial({ color: 0x82d844 }));
        ground.rotation.x = -Math.PI / 2; scene.add(ground);

        const sun = new THREE.Mesh(new THREE.CircleGeometry(40, 32), new THREE.MeshBasicMaterial({ color: 0xffe666, side: THREE.DoubleSide }));
        sun.position.set(120, 90, -500); scene.add(sun);

        function createDistantMountain(x, z, r, color) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), new THREE.MeshBasicMaterial({ color: color }));
            mesh.scale.set(r, r * 0.35, r * 0.2); mesh.position.set(x, -r * 0.25, z); scene.add(mesh);
        }
        createDistantMountain(-250, -550, 300, 0x82c8e5); createDistantMountain(200, -500, 250, 0x6bb5d8);
        createDistantMountain(0, -600, 400, 0x9bd4e4); createDistantMountain(-100, -450, 200, 0x5aa4c7); 

        const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        function createCloud(x, y, z, scale) {
            const group = new THREE.Group();
            group.add(new THREE.Mesh(new THREE.SphereGeometry(4, 16, 16), cloudMat)); 
            const c2 = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16), cloudMat); c2.position.set(-4, -1, 0); group.add(c2);
            const c3 = new THREE.Mesh(new THREE.SphereGeometry(2.5, 16, 16), cloudMat); c3.position.set(4, -1.5, 0); group.add(c3);
            group.position.set(x, y, z); group.scale.set(scale, scale * 0.7, scale); scene.add(group);
        }
        for (let i = 0; i < 15; i++) createCloud((Math.random() - 0.5) * 600, 50 + Math.random() * 50, -300 - Math.random() * 300, 0.8 + Math.random() * 1.5);

        function createSignTexture(text) {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#6e4321'; ctx.fillRect(0, 0, 512, 128); ctx.strokeStyle = '#4a2c15'; ctx.lineWidth = 15; ctx.strokeRect(0, 0, 512, 128);
            ctx.fillStyle = '#FFD700'; ctx.font = 'bold 42px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 256, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const startGate = new THREE.Group(); const woodMat = new THREE.MeshLambertMaterial({ color: 0x6e4321 }); 
        const p1 = new THREE.Mesh(new THREE.BoxGeometry(1, 8, 1), woodMat); p1.position.set(-4.5, 4, 0); const p2 = new THREE.Mesh(new THREE.BoxGeometry(1, 8, 1), woodMat); p2.position.set(4.5, 4, 0); startGate.add(p1, p2);
        const beam = new THREE.Mesh(new THREE.BoxGeometry(11, 1, 1), woodMat); beam.position.set(0, 7.5, 0); startGate.add(beam);
        const sign = new THREE.Mesh(new THREE.BoxGeometry(7, 1.8, 1.1), [ woodMat, woodMat, woodMat, woodMat, new THREE.MeshBasicMaterial({ map: createSignTexture("KHU RỪNG HÓA HỌC") }), woodMat ]); sign.position.set(0, 7.5, 0); startGate.add(sign);
        startGate.position.set(0, 0, 10); scene.add(startGate);

        const gate = new THREE.Mesh(new THREE.BoxGeometry(12, 10, 2), new THREE.MeshLambertMaterial({ color: 0xffd700 }));
        gate.position.set(0, 5, -300); scene.add(gate);

        activeQuestions = generateRandomizedQuestions();
        const obsGeo = new THREE.BoxGeometry(1.8, 1.8, 1.8); const obsMat = new THREE.MeshLambertMaterial({ color: 0xff3333 });
        let obstacles = []; const zigzagX = [0, -12, 10, -14, 12, -10, 14, -8, 10, 0]; 
        for (let i = 0; i < activeQuestions.length; i++) {
            const obs = new THREE.Mesh(obsGeo, obsMat); obs.position.set(zigzagX[i], 1.2, -i * 28 - 15); scene.add(obs);
            obstacles.push({ mesh: obs, data: activeQuestions[i], active: true });
        }

        const stoneGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.1, 8); const stoneMat = new THREE.MeshLambertMaterial({ color: 0xdddddd }); 
        let pathPoints = [{x: 0, z: 10}]; obstacles.forEach(o => pathPoints.push({x: o.mesh.position.x, z: o.mesh.position.z})); pathPoints.push({x: 0, z: gate.position.z}); 
        let pathStones = []; 
        for(let i=0; i<pathPoints.length - 1; i++) {
            let p1 = pathPoints[i]; let p2 = pathPoints[i+1]; let dist = Math.sqrt(Math.pow(p2.x-p1.x, 2) + Math.pow(p2.z-p1.z, 2)); let steps = Math.floor(dist / 2.5); 
            for(let j=1; j<steps; j++) {
                let sx = p1.x + (p2.x - p1.x) * (j / steps); let sz = p1.z + (p2.z - p1.z) * (j / steps);
                let actualX = sx + (Math.random()-0.5)*0.8; let actualZ = sz + (Math.random()-0.5)*0.8;
                let stone = new THREE.Mesh(stoneGeo, stoneMat); stone.position.set(actualX, 0.05, actualZ); scene.add(stone);
                pathStones.push({x: actualX, z: actualZ}); 
            }
        }
        obstacles.forEach(o => pathStones.push({x: o.mesh.position.x, z: o.mesh.position.z}));

        function createTree(x, z, scale) {
            const tg = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 3, 8), new THREE.MeshLambertMaterial({ color: 0x6e4321 })); trunk.position.y = 1.5; tg.add(trunk);
            const leafMat = new THREE.MeshLambertMaterial({ color: 0x3cb371 }); const lPos = [[0, 3.5, 0], [1.2, 3, 0.5], [-1.2, 3, 0.5], [0, 3, -1.2], [0, 4.8, 0]];
            lPos.forEach(p => { const leaf = new THREE.Mesh(new THREE.SphereGeometry(1.6, 12, 12), leafMat); leaf.position.set(p[0], p[1], p[2]); tg.add(leaf); });
            tg.scale.set(scale, scale, scale); tg.position.set(x, 0, z); scene.add(tg);
        }
        let treesPlanted = 0; let attempts = 0;
        while(treesPlanted < 200 && attempts < 2000) {
            attempts++; let x = (Math.random() - 0.5) * 80; let z = 12 - Math.random() * 352; let tooClose = false;
            for(let i=0; i<pathStones.length; i++) { if(Math.sqrt(Math.pow(x-pathStones[i].x, 2) + Math.pow(z-pathStones[i].z, 2)) < 4.5) { tooClose = true; break; } }
            if(!tooClose) { createTree(x, z, 0.7 + Math.random() * 0.6); treesPlanted++; }
        }

        const playerGroup = new THREE.Group(); const matY = new THREE.MeshLambertMaterial({ color: 0xffd700 }); const matB = new THREE.MeshLambertMaterial({ color: 0x2980b9 }); const matK = new THREE.MeshLambertMaterial({ color: 0x222222 }); const matW = new THREE.MeshLambertMaterial({ color: 0xffffff });  
        function addPart(geo, mat, x, y, z) { const mesh = new THREE.Mesh(geo, mat); mesh.position.set(x, y, z); playerGroup.add(mesh); return mesh; }
        addPart(new THREE.CylinderGeometry(0.6, 0.6, 1.2, 16), matY, 0, 1.6, 0); addPart(new THREE.SphereGeometry(0.6, 16, 16), matY, 0, 2.2, 0); addPart(new THREE.CylinderGeometry(0.61, 0.61, 0.6, 16), matB, 0, 1.3, 0); addPart(new THREE.SphereGeometry(0.61, 16, 16), matB, 0, 1.0, 0); addPart(new THREE.CylinderGeometry(0.62, 0.62, 0.15, 16), matK, 0, 2.1, 0); addPart(new THREE.CylinderGeometry(0.25, 0.25, 0.1, 16).rotateX(Math.PI/2), matK, 0, 2.1, 0.55); addPart(new THREE.SphereGeometry(0.22, 16, 16), matW, 0, 2.1, 0.52); addPart(new THREE.SphereGeometry(0.08, 16, 16), matK, 0, 2.1, 0.68); 
        const leftArm = addPart(new THREE.CylinderGeometry(0.12, 0.12, 0.6, 8).translate(0, -0.3, 0), matY, 0.7, 1.7, 0); const rightArm = addPart(new THREE.CylinderGeometry(0.12, 0.12, 0.6, 8).translate(0, -0.3, 0), matY, -0.7, 1.7, 0);
        const leftLeg = addPart(new THREE.CylinderGeometry(0.15, 0.15, 0.4, 8).translate(0, -0.2, 0), matB, 0.25, 0.7, 0); const rightLeg = addPart(new THREE.CylinderGeometry(0.15, 0.15, 0.4, 8).translate(0, -0.2, 0), matB, -0.25, 0.7, 0);
        playerGroup.rotation.y = Math.PI; playerGroup.position.set(0, 0, 18); scene.add(playerGroup);

        const keys = { w: false, a: false, s: false, d: false }; let isPaused = false; let walkTime = 0; 
        let gameTimeLimit = 300; let gameStartTime; let gameEnded = false; const timerUI = document.getElementById('timer-box');

        window.addEventListener('keydown', (e) => { if(!gameStarted) return; let key = e.key.toLowerCase(); if(key === 'w' || key === 'arrowup') keys.w = true; if(key === 's' || key === 'arrowdown') keys.s = true; if(key === 'a' || key === 'arrowleft') keys.a = true; if(key === 'd' || key === 'arrowright') keys.d = true; });
        window.addEventListener('keyup', (e) => { if(!gameStarted) return; let key = e.key.toLowerCase(); if(key === 'w' || key === 'arrowup') keys.w = false; if(key === 's' || key === 'arrowdown') keys.s = false; if(key === 'a' || key === 'arrowleft') keys.a = false; if(key === 'd' || key === 'arrowright') keys.d = false; });
        function bindTouchButton(btnId, targetKey) { const btn = document.getElementById(btnId); const press = (e) => { if(gameStarted){ e.preventDefault(); keys[targetKey] = true; } }; const release = (e) => { if(gameStarted){ e.preventDefault(); keys[targetKey] = false; } }; btn.addEventListener('touchstart', press, {passive: false}); btn.addEventListener('touchend', release, {passive: false}); btn.addEventListener('mousedown', press); btn.addEventListener('mouseup', release); btn.addEventListener('mouseleave', release); }
        bindTouchButton('btn-up', 'w'); bindTouchButton('btn-down', 's'); bindTouchButton('btn-left', 'a'); bindTouchButton('btn-right', 'd');

        const uiPanel = document.getElementById('ui-panel'); const questionText = document.getElementById('question-text'); const answersContainer = document.getElementById('answers-container');

        let explosionParticles = [];
        function createExplosion(x, y, z) {
            const pGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const pMat = new THREE.MeshLambertMaterial({ color: 0xff3333 });
            for(let i=0; i<25; i++) {
                let p = new THREE.Mesh(pGeo, pMat); p.position.set(x, y, z);
                p.userData.velocity = new THREE.Vector3((Math.random()-0.5)*0.8, Math.random()*0.6 + 0.2, (Math.random()-0.5)*0.8);
                p.userData.life = 1.0; scene.add(p); explosionParticles.push(p);
            }
        }

        function showFloatingScore(x, y, z) {
            let pos = new THREE.Vector3(x, y + 2, z); pos.project(camera);
            let screenX = (pos.x * .5 + .5) * window.innerWidth; let screenY = (pos.y * -.5 + .5) * window.innerHeight;
            let el = document.createElement('div'); el.className = 'floating-score'; el.innerText = '+1 Điểm';
            el.style.left = screenX + 'px'; el.style.top = screenY + 'px'; document.body.appendChild(el);
            setTimeout(() => el.remove(), 1500); 
        }

        function showQuestion(index) {
            isPaused = true; keys.w = keys.a = keys.s = keys.d = false; 
            const q = obstacles[index].data; questionText.innerText = `Câu ${index + 1}: ${q.q}`; answersContainer.innerHTML = '';
            
            q.a.forEach((ans, i) => {
                const btn = document.createElement('button'); btn.className = 'btn-answer'; btn.innerText = ans;
                const submitAnswer = (e) => {
                    if(e) e.preventDefault();
                    uiPanel.classList.remove('active'); 
                    
                    let obsPos = obstacles[index].mesh.position;

                    if (i === q.c) {
                        currentScore += 1; updateScoreUI(); 
                        showToast("✅ Chính xác! +1 Điểm", "rgba(46, 204, 113, 0.95)");
                        if(!isMuted) { sfxCorrect.play(); sfxExplode.play(); }
                        createExplosion(obsPos.x, obsPos.y, obsPos.z); showFloatingScore(obsPos.x, obsPos.y, obsPos.z);
                    } else {
                        showToast("❌ Tiếc quá sai mất rồi!", "rgba(231, 76, 60, 0.95)");
                        if(!isMuted) sfxWrong.play();
                    }
                    
                    scene.remove(obstacles[index].mesh); obstacles[index].active = false;
                    setTimeout(() => { if(!gameEnded) isPaused = false; }, 300);
                };
                btn.addEventListener('click', submitAnswer); btn.addEventListener('touchstart', submitAnswer, {passive: false});
                answersContainer.appendChild(btn);
            });
            uiPanel.classList.add('active'); 
        }

        const speed = 0.35;
        function animate() {
            requestAnimationFrame(animate);

            for(let i = explosionParticles.length - 1; i >= 0; i--) {
                let p = explosionParticles[i]; p.position.add(p.userData.velocity); p.userData.velocity.y -= 0.03; 
                p.scale.multiplyScalar(0.92); p.rotation.x += 0.1; p.rotation.y += 0.1; p.userData.life -= 0.02;
                if(p.userData.life <= 0) { scene.remove(p); explosionParticles.splice(i, 1); }
            }

            if (!gameStarted) { camera.position.x += (playerGroup.position.x - camera.position.x) * 0.1; camera.position.y = playerGroup.position.y + 7; camera.position.z += (playerGroup.position.z + 16 - camera.position.z) * 0.1; camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z); renderer.render(scene, camera); return; }

            if (!gameEnded) {
                let elapsedSeconds = Math.floor((Date.now() - gameStartTime) / 1000); let remaining = gameTimeLimit - elapsedSeconds;
                if (remaining <= 0) {
                    remaining = 0; gameEnded = true; isPaused = true; uiPanel.classList.remove('active');
                    bgMusic.pause(); 
                    document.getElementById('result-title').innerText = "⏳ HẾT GIỜ! ⏳"; document.getElementById('result-title').style.color = "#e74c3c";
                    document.getElementById('result-details').innerHTML = `<p>Đáng tiếc quá <span style="color:#3498db">${playerName}</span>,</p><div class="info-text">Em chưa kịp thoát khỏi khu rừng trong 5 phút.</div>`;
                    
                    localStorage.setItem('daThiHoa12', 'true'); // Đánh dấu đã hết giờ
                    document.getElementById('result-screen').style.display = 'flex';
                } else { let m = Math.floor(remaining / 60); let s = remaining % 60; timerUI.innerText = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s); }
            }

            if (!isPaused && !gameEnded) {
                let isMoving = false; let targetRotation = playerGroup.rotation.y; let nextZ = playerGroup.position.z; let nextX = playerGroup.position.x;
                if (keys.w) { nextZ -= speed; targetRotation = Math.PI; isMoving = true; } if (keys.s) { nextZ += speed; targetRotation = 0; isMoving = true; } if (keys.a) { nextX -= speed; targetRotation = -Math.PI / 2; isMoving = true; } if (keys.d) { nextX += speed; targetRotation = Math.PI / 2; isMoving = true; }
                if (nextZ > 9.5) { if (nextX > 3.5) nextX = 3.5; if (nextX < -3.5) nextX = -3.5; } else { if (nextX > 25) nextX = 25; if (nextX < -25) nextX = -25; }

                let currentGateIndex = obstacles.findIndex(o => o.active === true);
                if (currentGateIndex !== -1) { 
                    let gateZ = obstacles[currentGateIndex].mesh.position.z; 
                    if (nextZ < gateZ + 1.5) { nextZ = gateZ + 1.5; } 
                } else {
                    // KHÓA CHẶT CỔNG ĐÍCH, KHÔNG CHO VƯỢT QUÁ CỔNG
                    if (nextZ < gate.position.z + 1.5) { nextZ = gate.position.z + 1.5; }
                }

                playerGroup.position.z = nextZ; playerGroup.position.x = nextX; playerGroup.rotation.y = targetRotation;

                if (isMoving) { walkTime += 0.25; leftArm.rotation.x = Math.sin(walkTime) * 0.8; rightArm.rotation.x = -Math.sin(walkTime) * 0.8; leftLeg.rotation.x = -Math.sin(walkTime) * 0.8; rightLeg.rotation.x = Math.sin(walkTime) * 0.8; } else { leftArm.rotation.x = 0; rightArm.rotation.x = 0; leftLeg.rotation.x = 0; rightLeg.rotation.x = 0; }

                obstacles.forEach((obs, idx) => {
                    if (obs.active) {
                        obs.mesh.rotation.x += 0.02; obs.mesh.rotation.y += 0.03;
                        let dx = playerGroup.position.x - obs.mesh.position.x; let dz = playerGroup.position.z - obs.mesh.position.z;
                        if (Math.sqrt(dx*dx + dz*dz) < 1.8 && !isPaused) { showQuestion(idx); }
                    }
                });

                if (playerGroup.position.z <= gate.position.z + 2.5 && !gameEnded) {
                    isPaused = true; gameEnded = true;
                    let timeTaken = Math.floor((Date.now() - gameStartTime) / 1000); let m = Math.floor(timeTaken / 60); let s = timeTaken % 60; let timeString = (m > 0 ? m + " phút " : "") + s + " giây";
                    
                    sendScoreToSheet(playerName, playerId, currentScore, timeTaken);
                    
                    // GHI NHẬN ĐÃ THI VÀO TRÌNH DUYỆT IPAD
                    localStorage.setItem('daThiHoa12', 'true');
                    
                    bgMusic.pause();
                    if(!isMuted) sfxWin.play();

                    document.getElementById('result-title').innerText = "🎉 CHÚC MỪNG EM! 🎉"; document.getElementById('result-title').style.color = "#27ae60";
                    document.getElementById('result-details').innerHTML = `
                        <p>Học sinh: <span style="color:#e74c3c">${playerName}</span></p>
                        <p>Số báo danh: <span style="color:#e74c3c">${playerId}</span></p>
                        <p>Tổng điểm: <span style="font-size:26px; color:#f1c40f;">${currentScore} / 10</span></p>
                        <p>Thời gian: <span style="color:#e74c3c">${timeString}</span></p>
                        <div class="info-text">✅ Điểm đã được gửi về cho thầy cô!</div>
                    `;
                    document.getElementById('result-screen').style.display = 'flex';
                }
            }

            camera.position.x += (playerGroup.position.x - camera.position.x) * 0.1; camera.position.y = playerGroup.position.y + 7; camera.position.z += (playerGroup.position.z + 16 - camera.position.z) * 0.1; camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z); renderer.render(scene, camera);
        }
        function resizeGame() { const width = window.innerWidth; const height = window.innerHeight; camera.aspect = width / height; camera.updateProjectionMatrix(); renderer.setSize(width, height); }
        window.addEventListener('resize', resizeGame); window.addEventListener('orientationchange', function() { setTimeout(resizeGame, 300); });
        animate();
    </script>
</body>
</html>
