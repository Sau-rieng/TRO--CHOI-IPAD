<link rel="preconnect" href="https://fonts.googleapis.com">

<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;overflow:hidden}[hidden]{display:none!important}</style>
<style>
/* Cảnh 3D toàn màn hình. Góc trên trái/phải để trống cho khung (tên trò, Thoát, tiến độ, đồng hồ). */
:root{
  --bg:#e9ece7; --panel:#f6f7f3; --ink:#1d2623; --muted:#5b6762; --line:#cfd5cf;
  --lacquer:#9b2a23; --imperial:#a87b12; --chip:#e3e7e1;
  --tim:#5e3584;            /* áo dài tím Huế */
  --ok:#23805e; --ok-soft:#d6efe3; --bad:#b0352b; --bad-soft:#f6dcd8;
  --f-display:"Noto Serif Display","Times New Roman",Georgia,serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614;--panel:#171d1b;--ink:#e5eae6;--muted:#9aa6a0;--line:#2b3431;--lacquer:#e0635a;--imperial:#e3b747;
  --chip:#212926;--tim:#b48ade;--ok:#4cc492;--ok-soft:#173a2c;--bad:#ef7b70;--bad-soft:#3e1d1a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614;--panel:#171d1b;--ink:#e5eae6;--muted:#9aa6a0;--line:#2b3431;--lacquer:#e0635a;--imperial:#e3b747;
  --chip:#212926;--tim:#b48ade;--ok:#4cc492;--ok-soft:#173a2c;--bad:#ef7b70;--bad-soft:#3e1d1a;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.stage{position:relative;height:100%;overflow:hidden;background:var(--bg)}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
#c:active{cursor:grabbing}
button{font:inherit}
:is(button):focus-visible{outline:2px solid var(--imperial);outline-offset:2px}
.glass{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);box-shadow:0 2px 10px rgb(0 0 0 / .12)}

/* floating labels */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:999px;
  background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);color:var(--ink);
  font:500 12px/1.2 var(--f-body);white-space:nowrap;box-shadow:0 2px 6px rgb(0 0 0 / .12)}
.lbl b{display:grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:999px;background:var(--imperial);color:#fff;font:700 11px var(--f-body);font-variant-numeric:tabular-nums}
.lbl.st{font-weight:600}
.lbl.st.done b{background:var(--muted)} .lbl.st.done{font-weight:500;color:var(--muted)}
.lbl.name b{background:var(--muted)}
.nonames .lbl.name{display:none}
/* zoom rail */
.rail{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;padding:4px;border-radius:12px;z-index:4}
.rail button{width:40px;height:40px;border-radius:8px;border:1px solid transparent;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center;font:600 20px/1 var(--f-body)}
.rail button:hover{background:var(--chip)}
.rail button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.rail svg{width:20px;height:20px}
.rail hr{width:24px;border:0;border-top:1px solid var(--line);margin:2px auto}

/* minimap */
.mini{position:absolute;left:10px;top:50%;transform:translateY(-50%);border-radius:10px;padding:6px;z-index:4;pointer-events:none}
.mini canvas{display:block;width:120px;height:156px}

/* guide speech bubble */
.bubble{position:absolute;left:10px;bottom:10px;max-width:min(460px,calc(100% - 20px));display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;z-index:4}
.bubble svg{flex:none;width:40px;height:40px}
.bubble .who{font:700 12px var(--f-body);color:var(--tim);letter-spacing:.04em}
.bubble p{margin:0;font-size:13.5px;line-height:1.45}
.bubble p strong{color:var(--ok)} .bubble p strong.bad{color:var(--bad)}

/* d-pad */
.dpad{position:absolute;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px;z-index:4}
.dpad button{border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 90%,transparent);color:var(--ink);font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad button:active,.dpad button.held{background:var(--tim);color:#fff}
.dpad .u{grid-area:1/2} .dpad .l{grid-area:2/1} .dpad .r{grid-area:2/3} .dpad .d{grid-area:3/2}
@media (pointer:fine) and (min-width:821px){.dpad{display:none}}
.lbl.st.next b{background:var(--lacquer)} .lbl.st.next{border-color:var(--lacquer);font-weight:700}
.lbl.st.wait{display:none}   /* trạm chưa tới lượt: chỉ thấy viên ngọc nhỏ, đỡ rối mắt */
.lbl.st.ok b{background:var(--ok)} .lbl.st.part b{background:#c98b2b} .lbl.st.bad b{background:var(--bad)} .lbl.st.xong b{background:var(--muted)}
.dpad[hidden],.rail[hidden]{display:none}
@media (max-width:820px){
  .mini{display:none}
  .bubble{bottom:168px;max-width:calc(100% - 80px)}
  .bubble{left:10px}
  .rail{top:auto;bottom:168px;transform:none}
}
@media (max-width:820px) and (max-height:520px){ .bubble{bottom:10px;max-width:calc(100% - 190px)} .rail{bottom:auto;top:50%;transform:translateY(-50%)} }
</style>
</head>

const khC=new THREE.Color(), AN=new THREE.Matrix4().makeScale(0,0,0);

  khDau.setColorAt(i,khC.set(k.da)); khNon.setColorAt(i,khC.set(0xe2cd92)); khMu.setColorAt(i,khC.set([0xf2efe8,0x2f6fb5,0xd8433b][i%3]));
  khCo.setColorAt(i,khC.set([0xe7b93a,0xd8433b,0x2f9a6a][i%3])); khCan.setColorAt(i,khC.set(0x555555)); khMay.setColorAt(i,khC.set(0x222222)); });
function khDat(k,x,z,h,bob,i){
  khO.position.set(x,groundH(x,z)+bob,z); khO.rotation.set(0,h,0); khO.scale.setScalar(k.c); khO.updateMatrix();
  khThan.setMatrixAt(i,khO.matrix); khChan.setMatrixAt(i,khO.matrix); khDau.setMatrixAt(i,khO.matrix);
  khNon.setMatrixAt(i,k.non?khO.matrix:AN); khMu.setMatrixAt(i,!k.non&&k.mu?khO.matrix:AN);
  khCo.setMatrixAt(i,k.dan?khO.matrix:AN); khCan.setMatrixAt(i,k.dan?khO.matrix:AN); khMay.setMatrixAt(i,k.chup?khO.matrix:AN);
}
function viTri(r,s){ const L=r.L; let d=r.vong?((s%L)+L)%L:(((s%(2*L))+2*L)%(2*L)), lui=false; if(!r.vong&&d>L){ d=2*L-d; lui=true; }
  let g=r.seg[r.seg.length-1]; for(const q of r.seg) if(d<=q.o+q.l){ g=q; break; }
  const u=Math.min(d-g.o,g.l); return {x:g.x1+g.dx*u,z:g.z1+g.dz*u,dx:lui?-g.dx:g.dx,dz:lui?-g.dz:g.dz}; }
function capNhatKhach(dt,t){
  for(let i=0;i<NK;i++){ const k=KHACH[i];
    if(k.r){ k.s+=k.v*dt; const p=viTri(k.r,k.s), sg=Math.sign(k.v), dx=p.dx*sg, dz=p.dz*sg;
      khDat(k,p.x-dz*k.lech,p.z+dx*k.lech,Math.atan2(dx,dz),Math.abs(Math.sin(t*7+k.pha))*.12,i); }
    else khDat(k,k.x,k.z,k.h+Math.sin(t*.4+k.pha)*.5,0,i); }
  for(const m of [khThan,khChan,khDau,khNon,khMu,khCo,khCan,khMay]) m.instanceMatrix.needsUpdate=true;
}
capNhatKhach(0,0);
for(const m of [khThan,khChan,khDau,khNon,khMu,khCo,khCan,khMay]) m.instanceColor.needsUpdate=true;


/* ---------- labels ---------- */
const labelsEl=document.getElementById('labels'); const labels=[];
STATIONS.forEach(s=>{ const el=document.createElement('div'); el.className='lbl st'; labelsEl.appendChild(el); s.lbl=el; labels.push({el,x:s.x,y:13.5+groundH(s.x,s.z),z:s.z}); });
SITES.forEach(s=>{ const el=document.createElement('div'); el.className='lbl name'; el.innerHTML=`<b>•</b>${s.name}`; labelsEl.appendChild(el); labels.push({el,x:s.x,y:s.ly,z:s.z}); });
function paintLabel(s){ const isNext=s.n-1===tramTiep && !s.status;
  s.lbl.className='lbl st '+(s.status||(isNext?'next':'wait'));
  s.lbl.innerHTML=`<b>${s.n}</b>Trạm ${s.n} · ${s.status?'đã trả lời':isNext?s.place:'chưa tới lượt'}`; }
function refreshPanel(){ STATIONS.forEach(s=>{ paintLabel(s); paintStation(s); }); }
let lastSite=null;
function renderCard(s){ const id=s?s.id:null; if(id===lastSite) return; lastSite=id; if(s && performance.now()>holdUntil) say(`Đây là ${s.name}. ${s.desc}`); }

/* ---------- guide speech ---------- */
const sayEl=document.getElementById('say'); let holdUntil=0, hintTimer=0;
function say(t,hold){ sayEl.innerHTML=t; clearTimeout(hintTimer); if(hold) holdUntil=performance.now()+9000; }
const DIR=(dx,dz)=>{ const a=[]; if(dz<-20)a.push('bắc'); else if(dz>20)a.push('nam'); if(dx>20)a.push('đông'); else if(dx<-20)a.push('tây'); return a.length?'phía '+a.join(' '):'ngay gần đây'; };
function nextHint(){
  const n=STATIONS[tramTiep]; if(!n) return;
  say(`Trạm tiếp theo là Trạm ${n.n} ở ${n.place}, ${DIR(n.x-pos.x,n.z-pos.z)}, cách khoảng ${Math.round(Math.hypot(n.x-pos.x,n.z-pos.z))} m. Đi theo cột sáng màu vàng nhé!`,true);
}

/* ---------- movement ---------- */
const pos=new THREE.Vector3(-70,0,306); let yaw=Math.PI, walkPhase=0;
const keys=new Set();
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
  if(!chay || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'')) return;
  const k=KEYMAP[e.code]; if(k){ keys.add(k); e.preventDefault(); }
  if(e.key==='Shift') keys.add('fast');
});
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) keys.delete(k); if(e.key==='Shift') keys.delete('fast'); });

document.querySelectorAll('#dpad button').forEach(b=>{
  const k=b.dataset.k, on=e=>{e.preventDefault(); if(!chay) return; keys.add(k); b.classList.add('held'); try{b.setPointerCapture(e.pointerId);}catch(_){} }, off=()=>{keys.delete(k); b.classList.remove('held');};
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('lostpointercapture',off);
});

function blocked(x,z){
  const r=1.9; if(x<-290||x>290||z<-240||z>334) return true;
  for(const s of solids) if(x>s[0]-r&&x<s[2]+r&&z>s[1]-r&&z<s[3]+r) return true;
  for(const c of circles){ const dx=x-c[0],dz=z-c[1]; if(dx*dx+dz*dz<(c[2]+r)**2) return true; }
  return false;
}
function groundH(x,z){ let h=0; for(const f of floors) if(x>f[0]&&x<f[2]&&z>f[1]&&z<f[3]) h=Math.max(h,f[4]); return h; }

/* camera follow */
const FOCUS_FAR=new THREE.Vector3(0,0,40), FOCUS_TMP=new THREE.Vector3();
const camOff=new THREE.Vector3(0,105,78); let viewFar=false, offTween=null;
function placeCamera(){ controls.target.set(pos.x,pos.y+6,pos.z); camera.position.copy(controls.target).add(camOff); }
placeCamera();
const bView=document.getElementById('bView'); let nearDist=131, savedCam=null;
function zoomTo(len,far){ const dir=camera.position.clone().sub(controls.target).normalize();
  const to=dir.clone().multiplyScalar(len); if(far) to.y=Math.max(to.y,len*.75);
  offTween={t:0,from:camera.position.clone().sub(controls.target),to}; }
function camTo(len,elev){ const d=camera.position.clone().sub(controls.target); d.y=0; if(d.lengthSq()<1e-4) d.set(0,0,1); d.normalize();
  const to=d.multiplyScalar(len*Math.cos(elev)); to.y=len*Math.sin(elev); offTween={t:0,from:camera.position.clone().sub(controls.target),to}; }
function restoreCam(){ if(savedCam){ camTo(savedCam.len,savedCam.elev); savedCam=null; } }
function curDist(){ return camera.position.distanceTo(controls.target); }
document.getElementById('bIn').onclick=()=>{ const d=Math.max(controls.minDistance,curDist()*.7); zoomTo(d); if(viewFar&&d<200){viewFar=false;bView.setAttribute('aria-pressed','false');} };
document.getElementById('bOut').onclick=()=>zoomTo(Math.min(controls.maxDistance,curDist()*1.45));
bView.onclick=()=>{ viewFar=!viewFar; bView.setAttribute('aria-pressed',viewFar);
  if(viewFar){ nearDist=curDist(); zoomTo(360,true); } else zoomTo(Math.min(nearDist,160)); };
addEventListener('keydown',e=>{ if(!chay || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'')) return; if(e.key==='+'||e.key==='='){document.getElementById('bIn').click();} else if(e.key==='-'){document.getElementById('bOut').click();} });
const bN=document.getElementById('bNames'); bN.onclick=()=>{ const on=bN.getAttribute('aria-pressed')!=='true'; bN.setAttribute('aria-pressed',on); labelsEl.classList.toggle('nonames',!on); };
function zoomHoi(){ if(!savedCam){ const off=camera.position.clone().sub(controls.target), L=off.length(); savedCam={len:L,elev:Math.asin(Math.min(1,off.y/L))}; } camTo(40,.36); }
function huyPhim(){ keys.clear(); document.querySelectorAll('#dpad button.held').forEach(b=>b.classList.remove('held')); }

/* resize */
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

/* minimap */
const mini=document.getElementById('mini'), mctx=mini.getContext('2d');
const MX0=-205,MX1=205,MZ0=-185,MZ1=345;
function drawMini(){
  const cw=mini.clientWidth, ch=mini.clientHeight, dpr=Math.min(devicePixelRatio,2);
  if(mini.width!==Math.round(cw*dpr)){ mini.width=Math.round(cw*dpr); mini.height=Math.round(ch*dpr); }
  const sx=mini.width/(MX1-MX0), sz=mini.height/(MZ1-MZ0), P=(x,z)=>[(x-MX0)*sx,(z-MZ0)*sz];
  const c=mctx; c.clearRect(0,0,mini.width,mini.height);
  c.lineWidth=1.5*dpr; c.strokeStyle=miniCol.water; c.strokeRect(...P(-162,-172),324*sx,368*sz);
  c.strokeStyle=miniCol.line; c.strokeRect(...P(-150,-160),300*sx,320*sz);
  c.strokeStyle=miniCol.wall; c.strokeRect(...P(-62,-152),124*sx,152*sz);
  c.fillStyle=miniCol.line; c.fillRect(...P(-32,151),64*sx,34*sz); c.fillRect(...P(-23,262-15),46*sx,30*sz);
  c.fillRect(...P(-22,44),44*sx,28*sz); c.fillRect(...P(-128,4),56*sx,16*sz); c.fillRect(...P(72,12),56*sx,16*sz);
  c.fillStyle=miniCol.water; c.fillRect(...P(-205,338),410*sx,7*sz);
  c.fillStyle=miniCol.line; c.fillRect(...P(-205,298),410*sx,12*sz); c.fillRect(...P(-205,264),125*sx,12*sz); c.fillRect(...P(-60,264),265*sx,12*sz);
  c.fillStyle=miniCol.water; c.fillRect(...P(-47,113),42*sx,34*sz); c.fillRect(...P(5,113),42*sx,34*sz);
  for(const s of STATIONS){ const [x,y]=P(s.x,s.z), isNext=s.n-1===tramTiep&&!s.status;
    c.fillStyle=s.status==='ok'?miniCol.ok:s.status==='bad'?miniCol.bad:s.status==='part'?'#c98b2b':isNext?miniCol.gold:miniCol.line;
    c.globalAlpha=s.status||isNext?1:.5; c.beginPath(); c.arc(x,y,(isNext?5.2:3.4)*dpr,0,7); c.fill(); c.globalAlpha=1; }
  const [px,py]=P(pos.x,pos.z); c.save(); c.translate(px,py); c.rotate(-yaw); c.fillStyle=miniCol.tim;
  c.beginPath(); c.moveTo(0,7*dpr); c.lineTo(5*dpr,-5*dpr); c.lineTo(0,-2*dpr); c.lineTo(-5*dpr,-5*dpr); c.closePath(); c.fill(); c.restore();
}


/* ---------- loop ---------- */
const v=new THREE.Vector3(), clock=new THREE.Clock(), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const flagPos=flag.geometry.attributes.position, flagBase=flagPos.array.slice();
let t=0;
let fpsN=0, fpsT=0, nghi=0;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05); t+=dt;
  // đang dừng (hỏi câu / khóa / hết giờ) và máy quay đứng yên: chỉ vẽ khoảng 10 hình/giây để iPad nghỉ
  if(!chay && !offTween){ nghi+=dt; if(nghi<.1) return; } nghi=0;
  let fwd=(keys.has('up')?1:0)-(keys.has('down')?1:0), str=(keys.has('right')?1:0)-(keys.has('left')?1:0);
  let moving=false;
  if(chay && (fwd||str)){
    const f=controls.target.clone().sub(camera.position); f.y=0; f.normalize();
    const mx=f.x*fwd-f.z*str, mz=f.z*fwd+f.x*str, len=Math.hypot(mx,mz)||1;
    const sp=(keys.has('fast')?40:24)*dt, dx=mx/len*sp, dz=mz/len*sp;
    const ox=pos.x, oz=pos.z;
    if(!blocked(pos.x+dx,pos.z)) pos.x+=dx;
    if(!blocked(pos.x,pos.z+dz)) pos.z+=dz;
    const target=Math.atan2(mx,mz); let d=target-yaw; d=Math.atan2(Math.sin(d),Math.cos(d)); yaw+=d*Math.min(1,dt*12);
    moving=(pos.x!==ox||pos.z!==oz);
  }
  const gy=groundH(pos.x,pos.z); pos.y+= (gy-pos.y)*Math.min(1,dt*14);
  const want=viewFar?FOCUS_FAR:FOCUS_TMP.set(pos.x,pos.y+6,pos.z), nf=controls.target.clone().lerp(want,Math.min(1,dt*(viewFar?3:9)));
  camera.position.add(nf.clone().sub(controls.target)); controls.target.copy(nf);
  sky.position.copy(camera.position); WATER_TEX.offset.x=(t*.006)%1;
  sun.target.position.copy(controls.target); sun.position.copy(controls.target).addScaledVector(SUN_DIR,600);
  if(offTween){ offTween.t=Math.min(1,offTween.t+dt/(reduce?.01:1.1)); const k=1-(1-offTween.t)**3;
    camera.position.copy(controls.target).add(offTween.from.clone().lerp(offTween.to,k)); if(offTween.t>=1) offTween=null; }
  controls.update();
  if(dangHoi){ const fy=Math.atan2(camera.position.x-pos.x,camera.position.z-pos.z); let d=fy-yaw; d=Math.atan2(Math.sin(d),Math.cos(d)); yaw+=d*Math.min(1,dt*6); }
  // guide pose
  guide.position.copy(pos); guide.rotation.y=yaw;
  walkPhase+=moving?dt*(keys.has('fast')?13:9):0;
  const sw=moving?Math.sin(walkPhase):0, amp=moving?1:0;
  legs[0].rotation.x=.55*sw; legs[1].rotation.x=-.55*sw;
  arms[0].rotation.x=-.45*sw; arms[1].rotation.x=.45*sw;
  flaps[0].piv.rotation.x=-.14*Math.abs(sw)*amp-.04*Math.sin(t*2); flaps[1].piv.rotation.x=.2*Math.abs(sw)*amp+.04*Math.sin(t*2+1);
  body.position.y=moving?Math.abs(Math.cos(walkPhase))*.12:Math.sin(t*2)*.02;
  head.rotation.y=moving?0:Math.sin(t*.7)*.25;
  capNhatKhach(dt,t);
  // stations: chỉ trạm kế tiếp mới mở câu hỏi
  for(const s of STATIONS){
    s.mesh.gem.rotation.y+=dt*1.5; s.mesh.gem.position.y=11+Math.sin(t*2+s.n)*.5;
    if(!chay || s.status) continue;
    const d2=(s.x-pos.x)**2+(s.z-pos.z)**2;
    if(s.n-1===tramTiep){ if(d2<49) toiTram(s); }
    else if(d2<49 && performance.now()>holdUntil){ const n=STATIONS[tramTiep]; if(n) say(`Đây là Trạm ${s.n}, chưa tới lượt. Hãy tới Trạm ${n.n} ở ${n.place} trước (${DIR(n.x-pos.x,n.z-pos.z)}).`,true); }
  }
  // nearest site
  let near=null, best=1e9; for(const s of SITES){ const d=Math.hypot(s.x-pos.x,s.z-pos.z); if(d<s.r && d<best){best=d;near=s;} } renderCard(near);

  if(!reduce){ for(let i=0;i<flagPos.count;i++){ const x=flagBase[i*3]+6; flagPos.setZ(i,Math.sin(x*.6-t*4)*x*.06); } flagPos.needsUpdate=true; }
  renderer.render(scene,camera);

  const w=stage.clientWidth,h=stage.clientHeight;
  for(const L of labels){ v.set(L.x,L.y,L.z).project(camera);
    if(v.z>1||Math.abs(v.x)>1.1||Math.abs(v.y)>1.1){L.el.hidden=true;continue;} L.el.hidden=false;
    L.el.style.transform=`translate(${(v.x*.5+.5)*w}px,${(-v.y*.5+.5)*h}px) translate(-50%,-100%)`; L.el.style.zIndex=String(1000-Math.round(v.z*1000)); }
  drawMini();
  // tự hạ độ phân giải / tắt bóng nếu máy chậm (dưới ~38 hình/giây)
  if(chay){ fpsN++; fpsT+=dt; if(fpsT>=2){ const fps=fpsN/fpsT; fpsN=0; fpsT=0;
    if(fps<38 && PR>.75){ PR=Math.max(.75,+(PR-.25).toFixed(2)); renderer.setPixelRatio(PR); resize(); }
    else if(fps<30 && renderer.shadowMap.enabled){ renderer.shadowMap.enabled=false; scene.traverse(o=>{ if(o.material) o.material.needsUpdate=true; }); } } }
}


/* ---------- tới trạm → hỏi câu (khung lo câu hỏi, chấm điểm, kết quả) ---------- */
function toiTram(s){
  if(dangHoi) return; dangHoi=true; huyPhim();
  say(`Mình đang ở ${s.place}. Trả lời câu hỏi ở bảng bên cạnh nhé!`,true);
  KHUNG.hoiCau().then(kq=>{ dangHoi=false;
    if(!STATIONS[kq.i].status) STATIONS[kq.i].status=kq.dungHet?'ok':kq.diem>0?'part':'bad';
    tramTiep=Math.max(tramTiep,kq.i+1); luuMau(); refreshPanel();
    if(!kq.het) hintTimer=setTimeout(nextHint,2500);
  },()=>{ dangHoi=false; });
}
const MAU='khung-dainoi-mau';   // chỉ để tô lại màu các trạm đã làm khi tải lại trang
function luuMau(){ try{ localStorage.setItem(MAU,JSON.stringify(STATIONS.map(s=>s.status))); }catch(_){} }
function docMau(){ try{ return JSON.parse(localStorage.getItem(MAU)||'null')||[]; }catch(_){ return []; } }
function intro(){ holdUntil=performance.now()+12000; say('Xin chào! Mình là Thảo, hướng dẫn viên Đại Nội. Chúng ta đang ở con đường ven sông Hương. Đi thẳng qua cửa Quảng Đức để vào Kinh thành – Trạm 1 ở ngay cạnh Kỳ Đài. Đi lần lượt 11 trạm theo cột sáng màu vàng nhé!'); }

refreshPanel(); renderCard(null); say('Chọn lớp và vào chơi để bắt đầu tham quan Đại Nội cùng Thảo nhé!');
tick();

/* ████████ NỐI VỚI KHUNG – GIỮ CẤU TRÚC, CHỈ ĐỔI NỘI DUNG CÁC HÀM ████████ */
KHUNG.khoiTao({
  ten: 'Đại Nội Huế',
  tram: 'Trạm',
  luat: 'Dùng phím mũi tên (hoặc nút ▲▼◀▶) để đưa hướng dẫn viên Thảo đi lần lượt 11 trạm có cột sáng vàng. Tới trạm thì trả lời câu hỏi rồi đi tiếp. Nút + / − để phóng to, thu nhỏ.',
  batDau(tt){
    tramTiep=Math.min(tt.daLam,STATIONS.length);
    const mau=tt.tiepTuc?docMau():[];
    STATIONS.forEach((s,i)=>{ s.status=i<tramTiep?(mau[i]||'xong'):null; });
    if(!tt.tiepTuc) luuMau();
    const p=tramTiep?STATIONS[tramTiep-1]:null;
    if(p){ pos.set(p.x,0,p.z+4); yaw=Math.PI; } else { pos.set(-70,0,306); yaw=Math.PI; }
    pos.y=groundH(pos.x,pos.z); offTween=null; savedCam=null; viewFar=false; bView.setAttribute('aria-pressed','false'); camOff.set(0,105,78); placeCamera();
    refreshPanel(); document.getElementById('dpad').hidden=false;
    chay=true; canvas.focus({preventScroll:true});
    if(tt.tiepTuc && tramTiep) nextHint(); else intro();
  },
  tamDung(ly){ chay=false; huyPhim(); if(ly==='cau') zoomHoi(); },
  tiepTuc(ly){ chay=true; restoreCam(); canvas.focus({preventScroll:true}); },
  ketQua(i,kq){
    const s=STATIONS[i]; s.status=kq.dungHet?'ok':kq.diem>0?'part':'bad'; luuMau(); paintStation(s); paintLabel(s);
    s.mesh.gem.scale.setScalar(1.8);
    say(kq.dungHet?`Giỏi quá! Trạm ${s.n} trả lời đúng hết.`:kq.diem>0?`Trạm ${s.n} đúng một phần, cố lên nhé!`:`Trạm ${s.n} chưa đúng, xem giải thích rồi đi tiếp nhé.`,true);
  },
  veDich(ly){
    chay=false; huyPhim(); document.getElementById('dpad').hidden=true; restoreCam();
    say(ly==='done'?'Hoàn thành chuyến tham quan 11 trạm Đại Nội! Cảm ơn bạn đã đi cùng Thảo.':'Chuyến tham quan kết thúc. Cảm ơn bạn đã đi cùng Thảo!',true);
    if(!viewFar){ viewFar=true; bView.setAttribute('aria-pressed','true'); zoomTo(360,true); }
  }
});

})();
</script>
