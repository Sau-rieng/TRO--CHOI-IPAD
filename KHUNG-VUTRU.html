<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vũ trụ hành tinh 3D – Khung</title>
<!-- KHUNG VŨ TRỤ: cảnh Hệ Mặt Trời + phi hành gia + cách bay lấy từ trò "Vũ trụ hành tinh" (Hành trình Carbohydrate).
     Câu hỏi, đăng nhập, đồng hồ, chấm điểm, khóa màn hình, kết quả do khung-chung.js lo (xem HUONG-DAN-KHUNG.md).
     11 trạm, bay lần lượt 1 → 11: Mặt Trăng → Sao Kim → Sao Thủy → Mặt Trời → Sao Hỏa → Ceres → Sao Mộc → Sao Thổ
     → Sao Thiên Vương → Sao Hải Vương → Sao Diêm Vương. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Cảnh 3D toàn màn hình. Góc trên trái/phải để trống cho khung (tên trò, Thoát, tiến độ, đồng hồ).
   Bảng câu hỏi của khung hiện bên phải (iPad ngang) hoặc ở dưới (điện thoại). Chỉ một giao diện tối (vũ trụ). */
:root{
  --void:#05060c; --ink:#ecebf6; --muted:#9794b0;
  --panel:rgba(13,14,28,.82); --line:rgba(170,160,230,.22);
  --sol:#ffb547; --ok:#5fd18b; --part:#e0a33a; --bad:#ff7d73;
  --f-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--ink);font:15px/1.5 var(--f-body)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none;outline:none}
.hud{position:fixed;z-index:5;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px}

/* nhãn nổi trên hành tinh */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.nhan{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);text-shadow:0 0 6px #000;white-space:nowrap;transform:translate(-50%,-100%)}
.nhan b{display:grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#3b3a58;color:#fff;font:700 11px var(--f-body);letter-spacing:0;text-shadow:none}
.nhan.tiep{color:var(--sol);font-size:12px} .nhan.tiep b{background:var(--sol);color:#1d1100;box-shadow:0 0 0 3px rgba(255,181,71,.35)}
.nhan.ok b{background:var(--ok)} .nhan.part b{background:var(--part)} .nhan.bad b{background:var(--bad)} .nhan.xong b{background:#6d6a88}
.nhan.cho{opacity:.6}
.nhan.mep{opacity:.95}
.nhan.goc b{display:none}

/* gợi ý trạm tiếp theo (giữa, phía dưới) */
#goiY{left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:9px 16px;font-size:14px;text-align:center;max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goiY b{color:var(--sol)}
#loiNhan{left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:9px 16px;font-size:14px;text-align:center;max-width:calc(100% - 28px)}
body.dangHoi #goiY,body.dangHoi #loiNhan,body.dangHoi #pad{display:none!important}
#loiNhan b{color:var(--sol)} #loiNhan .ok{color:var(--ok)} #loiNhan .bad{color:var(--bad)}

/* phím tắt (máy tính) */
#phim{left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto auto;gap:2px 8px;padding:8px 10px;color:var(--muted);font-size:11px;white-space:nowrap}
#phim kbd{font:600 10px var(--f-body);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (pointer:coarse),(max-width:820px){#phim{display:none!important}}

/* nút điều khiển cảm ứng */
#pad{right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:6px}
#pad button{padding:0;font:600 20px var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
#pad button:active,#pad button.giu{background:rgba(255,181,71,.28);border-color:var(--sol)}
#pad .nho{font-size:14px;color:var(--muted)}
#pad .nhanh{grid-column:1/4;font-size:14px}
@media (pointer:fine) and (min-width:821px){#pad{display:none!important}}
@media (max-width:820px){#goiY{bottom:calc(196px + env(safe-area-inset-bottom,0px))}#loiNhan{bottom:calc(244px + env(safe-area-inset-bottom,0px))}}
@media (max-width:820px) and (max-height:520px){#goiY{left:12px;transform:none;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 220px)}#loiNhan{left:12px;transform:none;bottom:calc(62px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 220px)}}
</style>
</head>
<body>

<div id="stage"></div>
<div id="labels"></div>

<div class="hud" id="goiY" hidden></div>
<div class="hud" id="loiNhan" hidden aria-live="polite"></div>
<div class="hud" id="phim" hidden><span><kbd>↑</kbd><kbd>↓</kbd></span><span>bay tới / lùi</span><span><kbd>←</kbd><kbd>→</kbd></span><span>rẽ</span><span><kbd>Q</kbd><kbd>E</kbd></span><span>lên / xuống</span><span><kbd>Shift</kbd></span><span>tăng tốc</span><span><kbd>cuộn</kbd></span><span>gần / xa</span></div>
<div class="hud" id="pad" hidden aria-label="Nút bay">
  <button class="nho" data-z="-1" aria-label="Lại gần">＋</button><button data-k="up" aria-label="Bay tới">▲</button><button class="nho" data-z="1" aria-label="Ra xa">－</button>
  <button data-k="left" aria-label="Rẽ trái">◀</button><button data-k="down" aria-label="Lùi">▼</button><button data-k="right" aria-label="Rẽ phải">▶</button>
  <button class="nhanh" data-k="boost" aria-label="Tăng tốc">⚡ Tăng tốc</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- 4 dòng nối: KHÔNG XÓA, KHÔNG ĐỔI THỨ TỰ -->
<script src="https://sau-rieng.github.io/LAM-BAI-KIEM-TRA/cau-hinh-lop.js" data-banner="khong"></script>
<script src="noi-so-theo-doi.js"></script>
<script src="xuat-phat.js"></script>
<script src="khung-chung.js"></script>

<script>
(()=>{"use strict";
/* ████████ VÙNG CẢNH + DI CHUYỂN – ĐƯỢC SỬA TỰ DO ████████ */
const $=id=>document.getElementById(id);

// ================= THIÊN THỂ =================
const DATA=[
 {id:'sun',vi:'Mặt Trời',r:6,dist:0,period:0},
 {id:'mercury',vi:'Sao Thủy',r:.5,dist:11,period:88,tilt:.03,colors:['#8a8580','#b8b2a8','#5e5a55']},
 {id:'venus',vi:'Sao Kim',r:.95,dist:15,period:225,tilt:3.1,colors:['#e8c98a','#d9a860','#f2dfb0']},
 {id:'earth',vi:'Trái Đất',r:1,dist:20,period:365,tilt:.41,earth:true},
 {id:'mars',vi:'Sao Hỏa',r:.7,dist:26,period:687,tilt:.44,colors:['#c1502e','#a8401f','#d97a4a']},
 {id:'ceres',vi:'Ceres',r:.45,dist:32.5,period:1680,tilt:.07,colors:['#77726c','#9a948c','#55514c']},
 {id:'jupiter',vi:'Sao Mộc',r:3.2,dist:40,period:4333,tilt:.05,bands:['#d8b48a','#b07a52','#efd9b8','#9c6a48','#e5c49c']},
 {id:'saturn',vi:'Sao Thổ',r:2.7,dist:55,period:10759,tilt:.47,rings:true,bands:['#e8d4a2','#cfb07a','#f2e4c0','#b89a68']},
 {id:'uranus',vi:'Sao Thiên Vương',r:1.8,dist:68,period:30687,tilt:1.71,bands:['#9fe3e8','#b8eef0','#8fd4dc']},
 {id:'neptune',vi:'Sao Hải Vương',r:1.75,dist:80,period:60190,tilt:.49,bands:['#3f63d8','#5a7ff0','#2f4fb8']},
 {id:'pluto',vi:'Sao Diêm Vương',r:.42,dist:92,period:90560,tilt:.3,colors:['#c9b39a','#e6d6c2','#8f7a66']}
];
const BI=Object.fromEntries(DATA.map((d,i)=>[d.id,i]));
// 11 trạm theo thứ tự 1 → 11 ('moon' là Mặt Trăng của Trái Đất)
const TRAM=['moon','venus','mercury','sun','mars','ceres','jupiter','saturn','uranus','neptune','pluto'];

// ================= TEXTURE =================
function rnd(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}
function tex(draw,w=512,h=256){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
function rocky(cols,seed){return tex((g,w,h)=>{const r=rnd(seed);g.fillStyle=cols[0];g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){g.fillStyle=cols[1+Math.floor(r()*(cols.length-1))];g.globalAlpha=.08+r()*.25;g.beginPath();g.ellipse(r()*w,r()*h,3+r()*28,2+r()*18,0,0,7);g.fill()}g.globalAlpha=1})}
function banded(cols,seed,spot){return tex((g,w,h)=>{const r=rnd(seed);let y=0;
  while(y<h){const bh=4+r()*18;g.fillStyle=cols[Math.floor(r()*cols.length)];g.fillRect(0,y,w,bh+1);y+=bh}
  for(let i=0;i<300;i++){g.globalAlpha=.12;g.fillStyle=cols[Math.floor(r()*cols.length)];g.fillRect(r()*w,r()*h,20+r()*80,1+r()*3)}
  g.globalAlpha=1;if(spot){g.fillStyle='#b5482c';g.beginPath();g.ellipse(w*.62,h*.62,22,11,0,0,7);g.fill();g.fillStyle='#d8704a';g.beginPath();g.ellipse(w*.62,h*.62,13,6,0,0,7);g.fill()}})}
function earthTex(){return tex((g,w,h)=>{const r=rnd(42);g.fillStyle='#1d4f9c';g.fillRect(0,0,w,h);
  for(let i=0;i<26;i++){const cx=r()*w,cy=h*.15+r()*h*.7;for(let j=0;j<40;j++){g.fillStyle=r()<.5?'#3f8a45':'#6c9a4a';g.beginPath();g.arc(cx+(r()-.5)*70,cy+(r()-.5)*40,4+r()*12,0,7);g.fill()}}
  g.fillStyle='#eef4f8';g.fillRect(0,0,w,14);g.fillRect(0,h-14,w,14);
  g.globalAlpha=.35;for(let i=0;i<120;i++){g.fillStyle='#fff';g.beginPath();g.ellipse(r()*w,r()*h,10+r()*40,2+r()*5,0,0,7);g.fill()}g.globalAlpha=1})}
function sunTex(){return tex((g,w,h)=>{const r=rnd(7);g.fillStyle='#ff9a1f';g.fillRect(0,0,w,h);
  for(let i=0;i<1500;i++){g.globalAlpha=.25;g.fillStyle=['#ffd35c','#ff7a10','#ffe38a','#e85d0a'][Math.floor(r()*4)];g.beginPath();g.arc(r()*w,r()*h,1+r()*6,0,7);g.fill()}g.globalAlpha=1})}
function radial(stops){return tex((g,w,h)=>{const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);stops.forEach(([o,c])=>gr.addColorStop(o,c));g.fillStyle=gr;g.fillRect(0,0,w,h)},128,128)}
function ringTex(){return tex((g,w,h)=>{const r=rnd(9);for(let x=0;x<w;x++){const a=.25+r()*.6*(Math.sin(x*.05)*.5+.6);g.fillStyle=`rgba(${210+r()*30|0},${190+r()*25|0},${150+r()*30|0},${x<30||x>w-10?0:a})`;g.fillRect(x,0,1,h)}g.clearRect(w*.55,0,6,h)},512,8)}

// ================= CẢNH =================
let PR=Math.min(devicePixelRatio||1,1.5);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(PR);renderer.setSize(innerWidth,innerHeight);
$('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.05,5000);
camera.position.set(0,55,105);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=2;controls.maxDistance=400;controls.enablePan=false;
controls.autoRotate=true;controls.autoRotateSpeed=.35;
scene.add(new THREE.AmbientLight(0x505070,.6));
scene.add(new THREE.PointLight(0xfff1dd,2.2,0,1.2));
// đèn nhẹ đi theo camera để phi hành gia không bị tối khi quay lưng về Mặt Trời
const camLight=new THREE.DirectionalLight(0xc8d0ff,.45);camLight.position.set(0,.4,1);camera.add(camLight);scene.add(camera);

{const n=6000,p=new Float32Array(n*3),c=new Float32Array(n*3),r=rnd(3);
 for(let i=0;i<n;i++){const u=r()*2-1,t=r()*Math.PI*2,R=600+r()*900,s=Math.sqrt(1-u*u);
  p.set([R*s*Math.cos(t),R*u,R*s*Math.sin(t)],i*3);const k=r();c.set(k<.1?[1,.8,.6]:k<.2?[.7,.8,1]:[1,1,1],i*3)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.6,vertexColors:true,sizeAttenuation:false})))}
const belt=(()=>{const n=2500,p=new Float32Array(n*3),r=rnd(11);
 for(let i=0;i<n;i++){const a=r()*Math.PI*2,d=30+r()*5;p.set([Math.cos(a)*d,(r()-.5)*1.2,Math.sin(a)*d],i*3)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
 const m=new THREE.Points(g,new THREE.PointsMaterial({size:.18,color:0x9a8f80}));scene.add(m);return m})();

const bodies=[],labelsEl=$('labels');
let moonMesh=null;
DATA.forEach((d,i)=>{
  let mat;
  if(d.id==='sun')mat=new THREE.MeshBasicMaterial({map:sunTex()});
  else if(d.earth)mat=new THREE.MeshStandardMaterial({map:earthTex(),roughness:.8});
  else if(d.bands)mat=new THREE.MeshStandardMaterial({map:banded(d.bands,i*31,d.id==='jupiter'),roughness:.9});
  else mat=new THREE.MeshStandardMaterial({map:rocky(d.colors,i*17),roughness:1});
  const big=d.r>=1.5,mesh=new THREE.Mesh(new THREE.SphereGeometry(d.r,big?48:32,big?32:20),mat);
  const pivot=new THREE.Object3D();scene.add(pivot);
  const holder=new THREE.Object3D();holder.position.x=d.dist;holder.rotation.z=d.tilt||0;pivot.add(holder);holder.add(mesh);
  pivot.rotation.y=(i*1.37)%(Math.PI*2);
  const b={d,mesh,pivot,holder};
  if(d.id==='sun'){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:radial([[0,'rgba(255,200,90,1)'],[.25,'rgba(255,150,40,.55)'],[.6,'rgba(255,90,20,.12)'],[1,'rgba(0,0,0,0)']]),blending:THREE.AdditiveBlending,depthWrite:false}));s.scale.set(34,34,1);scene.add(s)}
  if(d.rings){const g=new THREE.RingGeometry(d.r*1.3,d.r*2.3,96),pos=g.attributes.position,uv=g.attributes.uv,v=new THREE.Vector3();
    for(let k=0;k<pos.count;k++){v.fromBufferAttribute(pos,k);uv.setXY(k,(v.length()-d.r*1.3)/d.r,.5)}
    const ring=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:ringTex(),side:THREE.DoubleSide,transparent:true,depthWrite:false}));ring.rotation.x=Math.PI/2;holder.add(ring)}
  if(d.earth){moonMesh=new THREE.Mesh(new THREE.SphereGeometry(.27,24,16),new THREE.MeshStandardMaterial({map:rocky(['#9a9a9a','#bcbcbc','#6e6e6e'],99)}));
    const mp=new THREE.Object3D();mp.rotation.z=-d.tilt;holder.add(mp);moonMesh.position.x=2.2;mp.add(moonMesh);b.moon=mp}
  if(d.dist){const pts=[];for(let k=0;k<=180;k++){const a=k/180*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*d.dist,0,Math.sin(a)*d.dist))}
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x8078c0,transparent:true,opacity:d.id==='ceres'?.12:.25})))}
  bodies.push(b);
});

// 11 trạm: mỗi trạm gắn với một thiên thể
const halo=radial([[0,'rgba(255,200,110,.0)'],[.55,'rgba(255,190,90,.0)'],[.7,'rgba(255,190,90,.75)'],[.8,'rgba(255,170,60,.25)'],[1,'rgba(0,0,0,0)']]);
const STATIONS=TRAM.map((id,i)=>{
  const moon=id==='moon',b=moon?null:bodies[BI[id]];
  const s={n:i+1,id,vi:moon?'Mặt Trăng':b.d.vi,mesh:moon?moonMesh:b.mesh,r:moon?.27:b.d.r,body:b,status:null};
  s.trig=id==='sun'?s.r+4:s.r+2.8;
  s.el=document.createElement('div');s.el.className='nhan cho';labelsEl.appendChild(s.el);
  return s;
});
// nhãn Trái Đất (nơi xuất phát)
const earthLbl=document.createElement('div');earthLbl.className='nhan goc';earthLbl.innerHTML='<b></b>Trái Đất · xuất phát';labelsEl.appendChild(earthLbl);
// vòng sáng đánh dấu trạm tiếp theo
const marker=new THREE.Sprite(new THREE.SpriteMaterial({map:halo,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
scene.add(marker);
// chớp sáng khi chấm xong một trạm
const flash=new THREE.Sprite(new THREE.SpriteMaterial({map:radial([[0,'rgba(255,255,255,1)'],[.3,'rgba(255,255,255,.5)'],[1,'rgba(0,0,0,0)']]),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,color:0xffffff}));
flash.visible=false;scene.add(flash);let flashT=0,flashS=null;

// ================= PHI HÀNH GIA =================
const astro=new THREE.Group();scene.add(astro);
const model=new THREE.Group();astro.add(model);
{
  const white=new THREE.MeshStandardMaterial({color:0xf3f3f6,roughness:.55});
  const grey=new THREE.MeshStandardMaterial({color:0x8a90a0,roughness:.7});
  const gold=new THREE.MeshStandardMaterial({color:0xffb24a,metalness:.85,roughness:.18,emissive:0x3a1c00});
  const add=(geo,mat,x,y,z,rx=0,rz=0)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,0,rz);model.add(m);return m};
  add(new THREE.CylinderGeometry(.3,.27,.62,18),white,0,0,0);
  add(new THREE.SphereGeometry(.3,24,18),white,0,.5,0);
  add(new THREE.SphereGeometry(.21,24,16,0,Math.PI*2,0,Math.PI/2.3),gold,0,.52,.13,Math.PI/2);
  add(new THREE.BoxGeometry(.44,.5,.22),grey,0,.05,-.27);
  add(new THREE.BoxGeometry(.2,.12,.04),new THREE.MeshStandardMaterial({color:0x3fa0ff,emissive:0x0a3060}),0,.08,.3);
  add(new THREE.CylinderGeometry(.08,.08,.5,10),white,.37,.02,0,0,.35);
  add(new THREE.CylinderGeometry(.08,.08,.5,10),white,-.37,.02,0,0,-.35);
  add(new THREE.CylinderGeometry(.1,.09,.5,10),white,.13,-.52,0);
  add(new THREE.CylinderGeometry(.1,.09,.5,10),white,-.13,-.52,0);
  add(new THREE.SphereGeometry(.11,10,8),grey,.13,-.8,.03);
  add(new THREE.SphereGeometry(.11,10,8),grey,-.13,-.8,.03);
}
const flame=new THREE.Mesh(new THREE.ConeGeometry(.14,.7,14,1,true),new THREE.MeshBasicMaterial({color:0xff9a3a,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
flame.rotation.x=Math.PI;flame.position.set(0,-.45,-.27);model.add(flame);
const flameGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:radial([[0,'rgba(255,190,90,1)'],[.4,'rgba(255,120,30,.4)'],[1,'rgba(0,0,0,0)']]),blending:THREE.AdditiveBlending,depthWrite:false}));
flameGlow.scale.set(1.1,1.1,1);flameGlow.position.set(0,-.75,-.27);model.add(flameGlow);
astro.scale.setScalar(.7);astro.visible=false;

// ================= TRẠNG THÁI =================
// mode: 'intro' (chưa vào chơi) · 'play' (đang chơi) · 'end' (về đích)
let mode='intro',chay=false,dangHoi=false,tramTiep=0,hoiTram=null,lockOffset=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const UP=new THREE.Vector3(0,1,0),tmp=new THREE.Vector3(),pp=new THREE.Vector3(),vel=new THREE.Vector3();
let yaw=0,chase=9;
const keys={};
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyQ:'rise',KeyE:'sink',ShiftLeft:'boost',ShiftRight:'boost'};
const clearKeys=()=>{for(const k in keys)keys[k]=false;document.querySelectorAll('#pad .giu').forEach(b=>b.classList.remove('giu'))};
const diChuyen=()=>mode==='play'&&chay&&!dangHoi;
const wpos=(s,v)=>s.mesh.getWorldPosition(v);

function datCanh(gan){   // đặt phi hành gia cạnh một thiên thể (gan = mesh + bán kính), quay mặt về trạm tiếp theo
  gan.mesh.getWorldPosition(pp);
  const out=pp.clone().setY(0);if(out.lengthSq()<1e-6)out.set(1,0,0);out.normalize();
  astro.position.copy(pp).addScaledVector(out,gan.r+7).setY(1);
  const t=STATIONS[Math.min(tramTiep,STATIONS.length-1)];wpos(t,tmp);
  const d=tmp.sub(astro.position);yaw=Math.atan2(d.x,d.z);
  vel.set(0,0,0);astro.rotation.set(0,yaw,0);model.rotation.set(0,0,0);
}
function camSau(){camera.position.copy(astro.position).add(new THREE.Vector3(-Math.sin(yaw)*chase,chase*.45,-Math.cos(yaw)*chase))}

// ---------- nhãn + lời nhắn ----------
function veNhan(){
  STATIONS.forEach((s,i)=>{
    const tiep=mode==='play'&&i===tramTiep;
    s.el.className='nhan '+(s.status||(tiep?'tiep':'cho'));
    s.el.innerHTML=`<b>${s.n}</b>${s.vi}${s.status?' ✓':''}`;s.el._m=null;
  });
  const g=$('goiY');
  if(mode==='play'&&tramTiep<STATIONS.length){const s=STATIONS[tramTiep];g.innerHTML=`🚀 Trạm tiếp theo: <b>${s.n} · ${s.vi}</b> <span id="conCach">–</span>`;g.hidden=false}
  else g.hidden=true;
}
let nhanT=null;
function nhan(html,ms=4500){const el=$('loiNhan');el.innerHTML=html;el.hidden=false;clearTimeout(nhanT);if(ms)nhanT=setTimeout(()=>el.hidden=true,ms)}
const MAU='khung-vutru-mau';   // chỉ để tô lại màu các trạm đã làm khi tải lại trang
function luuMau(){try{localStorage.setItem(MAU,JSON.stringify(STATIONS.map(s=>s.status)))}catch(_){}}
function docMau(){try{return JSON.parse(localStorage.getItem(MAU)||'null')||[]}catch(_){return[]}}

// ---------- tới trạm → hỏi câu (khung lo câu hỏi, chấm điểm, kết quả) ----------
function toiTram(s){
  if(dangHoi)return;dangHoi=true;hoiTram=s;clearKeys();vel.set(0,0,0);document.body.classList.add('dangHoi');
  wpos(s,pp);lockOffset=astro.position.clone().sub(pp).setLength(s.r+2);
  nhan(`Đã tới <b>Trạm ${s.n} · ${s.vi}</b>. Trả lời câu hỏi nhé!`,3500);
  KHUNG.hoiCau().then(kq=>{
    dangHoi=false;hoiTram=null;lockOffset=null;document.body.classList.remove('dangHoi');
    if(!STATIONS[kq.i].status)STATIONS[kq.i].status=kq.dungHet?'ok':kq.diem>0?'part':'bad';
    tramTiep=Math.max(tramTiep,kq.i+1);luuMau();veNhan();
    if(!kq.het&&tramTiep<STATIONS.length)nhan(`Bay tiếp tới <b>Trạm ${tramTiep+1} · ${STATIONS[tramTiep].vi}</b> – theo mũi tên màu cam.`,5000);
  },()=>{dangHoi=false;hoiTram=null;lockOffset=null;document.body.classList.remove('dangHoi')});
}

// ---------- điều khiển ----------
addEventListener('keydown',e=>{
  const a=KEYMAP[e.code];if(!a)return;
  if(e.target&&e.target.closest&&e.target.closest('input,select,textarea'))return;
  if(e.code.startsWith('Arrow')&&mode==='play')e.preventDefault();
  if(diChuyen())keys[a]=true;
});
addEventListener('keyup',e=>{const a=KEYMAP[e.code];if(a)keys[a]=false});
addEventListener('blur',clearKeys);
$('pad').querySelectorAll('button[data-k]').forEach(b=>{
  const k=b.dataset.k,on=e=>{e.preventDefault();if(diChuyen()){keys[k]=true;b.classList.add('giu')}},off=()=>{keys[k]=false;b.classList.remove('giu')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
});
const zoom=f=>{chase=Math.min(40,Math.max(4,chase*f))};
$('pad').querySelectorAll('button[data-z]').forEach(b=>b.addEventListener('click',()=>zoom(+b.dataset.z>0?1.25:.8)));
renderer.domElement.addEventListener('wheel',e=>{if(mode==='play'){e.preventDefault();zoom(e.deltaY>0?1.1:.9)}},{passive:false});
// chụm hai ngón trên iPad để gần / xa
{let d0=0;const pts=new Map();const cv=renderer.domElement;
 cv.addEventListener('pointerdown',e=>{pts.set(e.pointerId,e);if(pts.size===2){const[a,b]=[...pts.values()];d0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}});
 cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);if(pts.size===2&&mode==='play'){const[a,b]=[...pts.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(d0>0){zoom(d0/d);d0=d}}});
 const up=e=>{pts.delete(e.pointerId);d0=0};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);}

function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
addEventListener('resize',resize);

// ================= VÒNG LẶP =================
const clock=new THREE.Clock(),proj=new THREE.Vector3(),camWant=new THREE.Vector3(),lookAtV=new THREE.Vector3();
let time=0,fpsN=0,fpsT=0,veLech=false;
function datNhan(el,v,y,chiTrongMan){
  proj.copy(v);proj.y+=y;proj.project(camera);
  let x=proj.x,yy=proj.y;const behind=proj.z>1;if(behind){x=-x;yy=-yy}
  const off=behind||Math.abs(x)>.95||Math.abs(yy)>.85;
  if(off&&chiTrongMan){el.hidden=true;return}
  el.hidden=false;
  if(off){const xm=innerWidth<600?.62:.86,m=Math.max(Math.abs(x)/xm,Math.abs(yy)/.6);x/=m;yy/=m;
    el.dataset.mui=Math.abs(x)>=Math.abs(yy)*1.15?(x>0?'▶':'◀'):(yy>0?'▲':'▼')}else el.dataset.mui='';
  el.classList.toggle('mep',off);
  el.style.transform=`translate(${(x*.5+.5)*innerWidth}px,${(-yy*.5+.5)*innerHeight}px) translate(-50%,-100%)`;
}
function tick(){
  const dt=Math.min(clock.getDelta(),.05);time+=dt;
  // quỹ đạo: quay nhanh lúc chờ / về đích, chậm lúc chơi, đứng yên khi tạm dừng (câu hỏi, khóa, thoát)
  const orbitSpeed=mode==='play'?(diChuyen()?.06:0):.6;
  if(orbitSpeed){bodies.forEach(b=>{if(b.d.period)b.pivot.rotation.y+=dt*orbitSpeed*(365/b.d.period)*.35;});belt.rotation.y+=dt*orbitSpeed*.02}
  bodies.forEach(b=>{b.mesh.rotation.y+=dt*(b.d.id==='sun'?.08:.5)*(mode==='play'&&!diChuyen()?.3:1);if(b.moon&&orbitSpeed)b.moon.rotation.y+=dt*(mode==='play'?.6:3)});

  let thrust=0;
  if(diChuyen()){
    const turn=(keys.left?1:0)-(keys.right?1:0);
    yaw+=turn*dt*2.1;
    const fwd=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
    const acc=keys.boost?60:24;
    if(keys.up){vel.addScaledVector(fwd,acc*dt);thrust=1}
    if(keys.down){vel.addScaledVector(fwd,-acc*.6*dt)}
    if(keys.rise)vel.y+=18*dt;
    if(keys.sink)vel.y-=18*dt;
    vel.multiplyScalar(Math.exp(-1.6*dt));
    const max=keys.boost?34:15;if(vel.length()>max)vel.setLength(max);
    astro.position.addScaledVector(vel,dt);
    if(astro.position.length()>130)astro.position.setLength(130);
    astro.position.y=Math.max(-25,Math.min(25,astro.position.y));
    bodies.forEach(b=>{b.mesh.getWorldPosition(pp);const d=astro.position.distanceTo(pp),min=b.d.r+(b.d.id==='sun'?2:.7);
      if(d<min){tmp.copy(astro.position).sub(pp).setLength(min);astro.position.copy(pp).add(tmp);vel.multiplyScalar(.3)}});
    if(moonMesh){moonMesh.getWorldPosition(pp);const d=astro.position.distanceTo(pp);if(d<.8){tmp.copy(astro.position).sub(pp).setLength(.8);astro.position.copy(pp).add(tmp)}}
    if(tramTiep<STATIONS.length){const s=STATIONS[tramTiep];wpos(s,pp);if(astro.position.distanceTo(pp)<s.trig)toiTram(s)}
    astro.rotation.set(0,yaw,0);
    model.rotation.x+=((keys.up?.9:keys.down?-.25:0)-model.rotation.x)*Math.min(1,dt*5);
    model.rotation.z+=(((keys.left?-.35:0)+(keys.right?.35:0))-model.rotation.z)*Math.min(1,dt*5);
  }else if(dangHoi&&hoiTram&&lockOffset){
    wpos(hoiTram,pp);
    astro.position.copy(pp).add(lockOffset);if(!reduce)astro.position.y+=Math.sin(time*1.6)*.12;
    const d=pp.clone().sub(astro.position);
    let dy=Math.atan2(d.x,d.z)-yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));yaw+=dy*Math.min(1,dt*3);
    astro.rotation.set(0,yaw,0);
    model.rotation.x+=(0-model.rotation.x)*Math.min(1,dt*4);model.rotation.z=reduce?0:Math.sin(time*.9)*.08;
  }else{
    model.rotation.x+=(0-model.rotation.x)*Math.min(1,dt*4);model.rotation.z=reduce?0:Math.sin(time*.9)*.08;
  }
  flame.visible=flameGlow.visible=thrust>0;
  if(thrust){flame.scale.set(1,(keys.boost?1.5:1)*(.8+Math.random()*.4),1);flameGlow.material.opacity=.7+Math.random()*.3}

  // camera: bám sau phi hành gia khi chơi; khi hỏi thì lùi ra để thấy trạm, lệch sang trái nhường chỗ bảng câu hỏi
  if(mode==='play'){
    const inQ=dangHoi&&hoiTram;
    const dist=inQ?Math.max(chase,hoiTram.r*2.4+6):chase;
    camWant.set(-Math.sin(yaw)*dist,dist*.42,-Math.cos(yaw)*dist).add(astro.position);
    camera.position.lerp(camWant,1-Math.exp(-4*dt));
    lookAtV.copy(astro.position).addScaledVector(UP,.6);
    if(inQ){wpos(hoiTram,pp);lookAtV.lerp(pp,.35)}
    camera.lookAt(lookAtV);
  }else controls.update();
  const lech=mode==='play'&&dangHoi&&innerWidth>760;
  if(lech!==veLech){veLech=lech;if(lech)camera.setViewOffset(innerWidth,innerHeight,Math.min(250,innerWidth*.2),0,innerWidth,innerHeight);else camera.clearViewOffset()}

  // vòng sáng trạm tiếp theo
  if(mode==='play'&&tramTiep<STATIONS.length){const s=STATIONS[tramTiep];wpos(s,pp);marker.visible=true;marker.position.copy(pp);
    const k=s.id==='sun'?2.6:(s.r*3.2+2.2);marker.scale.setScalar(k*(1+(reduce?0:Math.sin(time*3)*.08)))}else marker.visible=false;
  if(flash.visible){flashT+=dt;const k=flashT/.9;if(k>=1)flash.visible=false;else{wpos(flashS,pp);flash.position.copy(pp);flash.scale.setScalar((flashS.r*2+2)*(1+k*2.5));flash.material.opacity=1-k}}

  renderer.render(scene,camera);

  // nhãn: trạm tiếp theo luôn hiện (ra mép màn hình kèm mũi tên nếu khuất), các trạm khác chỉ hiện khi trong màn hình
  STATIONS.forEach((s,i)=>{wpos(s,pp);const tiep=mode==='play'&&i===tramTiep;datNhan(s.el,pp,s.r*1.15+(s.id==='moon'?.35:0),!tiep);
    const m=s.el.dataset.mui||'';if(s.el._m!==m){s.el._m=m;s.el.innerHTML=`${m?m+' ':''}<b>${s.n}</b>${s.vi}${s.status?' ✓':''}`}});
  bodies[BI.earth].mesh.getWorldPosition(pp);datNhan(earthLbl,pp,1.6,true);if(mode!=='play')earthLbl.hidden=true;
  if(mode==='play'&&tramTiep<STATIONS.length){const el=document.getElementById('conCach');if(el){wpos(STATIONS[tramTiep],pp);const d=Math.max(0,astro.position.distanceTo(pp)-STATIONS[tramTiep].trig);el.textContent=d<1?'· tới nơi':`· còn ${Math.round(d)}`}}

  // tự hạ độ phân giải nếu máy chậm (dưới ~38 hình/giây)
  if(diChuyen()){fpsN++;fpsT+=dt;if(fpsT>=2){const fps=fpsN/fpsT;fpsN=0;fpsT=0;if(fps<38&&PR>.75){PR=Math.max(.75,+(PR-.25).toFixed(2));renderer.setPixelRatio(PR);resize()}}}
  requestAnimationFrame(tick);
}
veNhan();
tick();
window.__vt={STATIONS,astro,get tramTiep(){return tramTiep},toi(i){const s=STATIONS[i];wpos(s,pp);astro.position.copy(pp).add(new THREE.Vector3(s.trig*.6,0,0))}};

/* ████████ NỐI VỚI KHUNG – GIỮ CẤU TRÚC, CHỈ ĐỔI NỘI DUNG CÁC HÀM ████████ */
KHUNG.khoiTao({
  ten: 'Vũ trụ hành tinh',
  tram: 'Trạm',
  luat: 'Điều khiển phi hành gia bay lần lượt 11 trạm trong Hệ Mặt Trời, bắt đầu từ Mặt Trăng: ↑ bay tới, ↓ lùi, ← → rẽ, Q / E lên xuống, giữ Shift để tăng tốc (iPad: dùng các nút ▲ ◀ ▶ ▼ và ⚡ ở góc dưới bên phải). Trạm tiếp theo có vòng sáng và nhãn màu cam; bay lại gần để nhận câu hỏi.',
  batDau(tt){
    tramTiep=Math.min(tt.daLam,STATIONS.length);
    const mau=tt.tiepTuc?docMau():[];
    STATIONS.forEach((s,i)=>{s.status=i<tramTiep?(mau[i]||'xong'):null});
    if(!tt.tiepTuc)luuMau();
    mode='play';chay=true;dangHoi=false;hoiTram=null;lockOffset=null;chase=9;clearKeys();
    controls.enabled=false;controls.autoRotate=false;astro.visible=true;
    // chơi tiếp sau khi tải lại trang: đứng cạnh trạm vừa làm xong; lượt mới: cạnh Trái Đất
    if(tramTiep>0)datCanh(STATIONS[tramTiep-1]);else datCanh({mesh:bodies[BI.earth].mesh,r:2});
    camSau();
    $('pad').hidden=false;$('phim').hidden=false;veNhan();
    if(tt.tiepTuc&&tramTiep)nhan(`Chơi tiếp: bay tới <b>Trạm ${tramTiep+1} · ${STATIONS[Math.min(tramTiep,10)].vi}</b>.`,6000);
    else nhan('Phi hành gia xuất phát từ Trái Đất. Bay tới <b>Trạm 1 · Mặt Trăng</b> ngay bên cạnh!',7000);
    renderer.domElement.focus&&renderer.domElement.focus({preventScroll:true});
  },
  tamDung(ly){chay=false;clearKeys();vel.set(0,0,0)},
  tiepTuc(ly){chay=true},
  ketQua(i,kq){
    const s=STATIONS[i];s.status=kq.dungHet?'ok':kq.diem>0?'part':'bad';luuMau();veNhan();
    flashS=s;flashT=0;flash.visible=true;flash.material.color.set(kq.dungHet?0x7dffb0:kq.diem>0?0xffc860:0xff8a80);
    nhan(kq.dungHet?`<span class="ok">Tuyệt vời!</span> Trạm ${s.n} đúng hết.`:kq.diem>0?`Trạm ${s.n} đúng một phần, cố lên!`:`<span class="bad">Trạm ${s.n} chưa đúng.</span> Đọc giải thích rồi bay tiếp nhé.`,5000);
  },
  veDich(ly){
    mode='end';chay=false;dangHoi=false;hoiTram=null;clearKeys();document.body.classList.remove('dangHoi');
    $('pad').hidden=true;$('phim').hidden=true;veNhan();
    controls.enabled=true;controls.autoRotate=!reduce;controls.target.set(0,0,0);camera.position.set(0,70,125);
    nhan(ly==='done'?'🎉 Hoàn thành hành trình 11 trạm qua Hệ Mặt Trời!':'Chuyến bay kết thúc. Tàu đã quay về Trái Đất.',0);
  }
});
})();
</script>
